name: Build and Check Links

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create pages from multilingual YAML files
        run: ./scripts/build-pages.sh

      - name: Build site
        run: ./scripts/build-site-folder.sh

      - name: Start Jekyll
        run: docker compose up -d jekyll

      - name: Wait for Jekyll
        run: |
          echo "Waiting for Jekyll..."

          for i in {1..30}; do
            if curl -fsS http://localhost:4312 > /dev/null; then
              echo "Jekyll is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Jekyll failed to start"
          docker compose logs jekyll
          exit 1

      - name: Check broken links
        run: |
          docker run --rm \
            --network biothermica-site-2026 \
            dcycle/broken-link-checker:3 \
            --ignore-url "css/images/" \
            http://jekyll:4000

      # ==========================================
      # onclick="window.location.href=..."
      # ==========================================
      - name: Run onclick link checker
        run: |
          docker run --rm \
              --network biothermica-site-2026 \
              -v "$(pwd)/docs/_site:/site:ro" \
              -v "$(pwd)/scripts/check-onclick-links.py:/check-onclick-links.py:ro" \
              python:3.12-slim \
              python /check-onclick-links.py \
                  /site \
                  --base-url http://jekyll:4000/

      - name: Stop Jekyll
        if: always()
        run: docker compose down

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/_site'

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
