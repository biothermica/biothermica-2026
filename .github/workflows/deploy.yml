name: Run Script on Push, then build GH pages

on:
  push:
    branches: ["master"]

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Create pages from multilingual YAML files
        run: ./scripts/build-pages.sh

      - name: Start Jekyll
        run: |
          docker compose up -d jekyll

      - name: Check broken links
        run: |
          docker run --rm \
            --network biothermica-site-2026 \
            dcycle/broken-link-checker:3 \
            http://jekyll

      - name: Stop Jekyll
        if: always()
        run: docker compose down

      - name: Build site folder
        run: ./scripts/build-site-folder.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/_site'

  deploy:
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
