name: Run Script on Push, then build GH pages

on:
  push:
    branches: ["master"]

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Generate multilingual pages first
      - name: Create pages from multilingual YAML files
        run: ./scripts/build-pages.sh

      # Start Jekyll
      - name: Start Jekyll
        run: |
          docker compose up -d jekyll

      # Wait until Jekyll is ready
      - name: Wait for Jekyll
        run: |
          echo "Waiting for Jekyll..."

          for i in {1..30}; do
            if curl -fsS http://localhost:4312/ > /dev/null; then
              echo "Jekyll is ready!"
              break
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          curl -fsS http://localhost:4312/ > /dev/null

      # Check broken links from inside the Docker network
      - name: Check broken links
        run: |
          docker run --rm \
            --network biothermica-site-2026 \
            dcycle/broken-link-checker:3 \
            http://jekyll:4000

      # Stop Jekyll after broken-link check
      - name: Stop Jekyll
        if: always()
        run: docker compose down

      # Build final GitHub Pages site
      - name: Build site folder
        run: ./scripts/build-site-folder.sh

      # Upload GitHub Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/_site'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
