{% comment %}
sections:
  - structure: text
    text: |
      Your text here.
    data_hide_me_on: "2026-09-24"
    wrapper_class: ""
{% endcomment %}

<div class="wrapper {% if _block.wrapper_class %} {{ _block.wrapper_class }} {% endif %}"

  {% if _block.data_hide_me_on %}
    data-hide-me-on="{{ _block.data_hide_me_on }}"
  {% endif %}

>
  <div class="inner">
    <!-- Feature 1 -->
      <section class="container box feature1">
        <div class="row">


          <h3 style="text-transform: none;letter-spacing: normal;">{{ _text | markdownify }}</h3>


        </div>
      </section>

  </div>
</div>
