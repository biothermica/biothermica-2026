<!-- Cookie Consent Banner -->
<div id="cookie-banner" style="display:none !important; position:fixed; bottom:0; left:0; right:0; background:#222; color:#fff; padding:14px 20px; z-index:9999; font-family:sans-serif; font-size:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
  <span style="flex:1; min-width:200px;">Ce site utilise des cookies. Acceptez-vous ? This site uses cookies. Do you accept?</span>
  <button onclick="setCookieConsent(true)"  style="background:#133178; color:#fff; border:none; padding:8px 16px; cursor:pointer; border-radius:3px;">Accept / Accepter</button>
  <button onclick="setCookieConsent(false)" style="background:#888;    color:#fff; border:none; padding:8px 16px; cursor:pointer; border-radius:3px;">Decline / Refuser</button>
</div>

<script>
  function loadGA() {
    var s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=UA-2093852-1';
    s.async = true;
    document.head.appendChild(s);

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('set', 'developer_id.dMDhkMT', true);
    gtag('config', 'UA-2093852-1', { groups: 'default' });
  }

  function setCookieConsent(accepted) {
    localStorage.setItem('cookie_consent', accepted ? 'accepted' : 'declined');
    document.getElementById('cookie-banner').style.display = 'none';
    if (accepted) loadGA();
  }

  var consent = localStorage.getItem('cookie_consent');
  if (consent === 'accepted') {
    loadGA();
  } else if (consent !== 'declined') {
    document.getElementById('cookie-banner').style.display = 'flex';
  }
</script>
