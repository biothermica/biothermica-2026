{% assign _lang = page.lang %}

<div id="language-selector" class="language-selector">
  {% for path in _data.paths %}
    <a href="{{ path[1] }}"
       class="{% if path[0] == _lang %}active{% endif %}">
      {{ path[0] | upcase }}
    </a>
    {% unless forloop.last %} | {% endunless %}
  {% endfor %}
</div>
