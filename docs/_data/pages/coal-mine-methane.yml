    text:
      en: |
        Biothermica develops and finances coal mine [ventilation air methane (VAM)](http://www.epa.gov/cmop/basic.html#methane) carbon projects based
        on its proprietary [VAMOX® technology](/sites/biothermica.com/files/biothermica-vam-brochure_2.pdf). Biothermica manages all development stages, from the
        design of the project to the commercialization of the emission reduction credits on the carbon
        markets.  Project stages are typically as follows:

        ### Feasibility studies and site selection
        The first step consists in selecting the best site for the development of the project. The following
        technical and economic studies are undertaken:

        - Assessment of the VAM resources
        - Evaluation of site characteristics
        - Economic and financial analysis

        ### Financing strategy

        If the studies are conclusive and the site’s characteristics are worth exploiting, Biothermica carries
        out the financing of the project, which comprises:

        - Financial structure of the project
        - Financial partners
        - Project budget and schedule

        ### Permits and authorizations
        The necessary authorizations regarding the construction of the project are obtained from
        governmental and local authorities.

        ### Construction, commissioning and operation
        Once the necessary authorizations have been obtained, Biothermica proceeds to the construction
        of the project according to the established schedule. The company’s engineers also proceed to
        project commissioning and operation.

        ### Carbon credit sales
        Biothermica’s expertise covers the full carbon project cycle, as the company has developed
        projects under various international and national carbon standards since 2005. A carbon project
        is typically characterized by the following stages:

        - Selection of a carbon standard
        - Project Design Document development
        - Validation of Project Design Document
        - Project registration
        - Implementation and monitoring
        - Verification of emissions reductions
        - Certification and issuance of credits
        - Commercialization of emissions reductions

      fr: |
        Biothermica développe et finance des projets carbone basés sur sa propre technologie VAMOX® appliquée
        à l'oxydation du méthane contenu dans l'air de ventilation (VAM) des mines de
        charbon souterraines. Biothermica gère toutes les étapes du projet, depuis la phase
        d'ingénierie jusqu'à la vente des crédits de carbone:

        ### Étude de faisabilité et choix du site
        Cette première étape consiste à sélectionner le meilleur site pour le développement du projet. Les
        études techniques et économiques suivantes sont entreprises:

        - Évaluation de la ressource
        - Caractéristiques du site
        - Analyse économique et financière

        ### Stratégie de financement
        Si les études s'avèrent concluantes, Biothermica procède à la phase de financement du projet, qui
        comprend:

        - Structure financière du projet
        - Partenaires financiers
        - Budget et échéancier

        ### Permis et autorisations

        Les autorisations nécessaires pour la construction du projet sont obtenues auprès des autorités
        gouvernementales et locales.

        ### Construction, mise en service et opération
        Une fois les autorisations nécessaires obtenues, Biothermica procède à la construction du projet
        conformément à l'échéancier établi. L'entreprise gère également l'étape de mise en service et
        l'opération du projet.

        ### Vente de crédits de carbone
        L'expertise de Biothermica couvre le cycle de projet carbone au complet, l'entreprise ayant
        développé des projets carbone sous l'égide de nombreux standards carbone depuis 2005. Un
        projet carbone comprend typiquement les étapes suivantes:

        - Sélection d'un standard carbone
        - Dévelopment du document de projet (PDD)
        - Validation du document de projet
        - Enregistrement du projet
        - Mise en place du projet et suivi des émissions
        - Vérification des réductions d'émission
        - Émission des crédits
        - Commercialisation des crédits de carbone
