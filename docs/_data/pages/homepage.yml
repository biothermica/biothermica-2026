  - structure: presentationtext
    text:
      en: 'Biothermica is partnering with the AIMQ “Genial!” Congress, taking place September 20–23, 2026, at the Palais des congrès de Gatineau.
          On Tuesday, September 22 at 8:30 a.m., Guillaume St-Laurent, P.Eng., from the City of Gatineau, will present a conference on:
          **"Rehabilitation of a biogas collection system at a former landfill: technical challenges and environmental benefits."**
          Biothermica is proud to support the conference as a break partner, highlighting a Gatineau project that benefited local residents and where Biothermica’s technical expertise contributed to the project’s success.'
      fr: ""
