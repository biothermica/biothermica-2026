    text:
      en: |
        A rigorous assessment of the landfill gas resource is essential to any project aimed at controlling emissions or recovering energy. It supports the project’s long-term financial viability and enables the proper sizing of gas collection, treatment and energy-production equipment.
        At some closed or small-capacity landfill sites, however, gas production is insufficient to operate a flare or utilisation system. The landfill gas may then be released directly into the atmosphere, particularly through passive vents. These situations also require an assessment to determine the associated risks and appropriate management measures.
        Biothermica supports landfill operators at every stage, from the initial resource assessment to the design, construction, commissioning and operation of the facilities.

        ### Landfill Gas Generation Assessment
        Using a georeferenced surface-sampling technique developed in the early 1990s, Biothermica can assess the actual quantities of landfill gas released into the atmosphere and identify areas where emissions are most significant.
        When the results indicate a substantial landfill gas resource, a dynamic pumping test can be conducted to accurately measure the available gas flow, gas quality and the landfill’s response to controlled vacuum conditions.

        ### Landfill Gas Characterisation
        Landfill gas samples are collected and analysed by specialised laboratories to determine their chemical composition. Testing may cover organochlorine compounds, sulphur compounds, chlorofluorocarbons, siloxanes and other contaminants that may be present.
        This characterisation is essential for selecting the appropriate treatment technologies, preventing corrosion and protecting gas collection, destruction and utilisation equipment. It also supports a more accurate assessment of the risks associated with atmospheric emissions, odours and landfill gas migration.

        ### Future Methane Generation Potential
        Biothermica forecasts future landfill gas production using mathematical models calibrated to the site’s characteristics and field measurements.
        During dynamic pumping tests, waste samples may also be collected and analysed to determine their organic-matter content. These data provide a more accurate assessment of the remaining methane-generation potential and how it is expected to evolve over time.

        ### Energy-Recovery and Greenhouse Gas Reduction Potential
        Based on projected landfill gas production, gas composition and energy market conditions, Biothermica evaluates the available utilisation options. These may include the production of electricity or heat and the upgrading of landfill gas into renewable natural gas for pipeline injection or use as a vehicle fuel.
        The analysis identifies the solution best suited to the site, evaluates its technical and financial feasibility and estimates the potential reduction in greenhouse gas emissions.

        ### Management of Low-Production Landfill Gas Sites
        At many closed or small-capacity landfill sites, gas production is insufficient or too variable to operate a flare or energy-recovery system continuously. Landfill gas may therefore be released directly into the atmosphere, particularly through passive vents. Even at low flow rates, these releases may represent a source of methane emissions, odours or subsurface gas migration.
        Biothermica assesses the flow rate, composition and distribution of emissions to determine the management approach best suited to the site. Depending on site conditions, potential solutions may include improvements to the passive venting system, consolidation of multiple emission points, the use of a flare or destruction system designed for low gas flows, or biological oxidation systems such as biofilters and biocovers.
        The objective is to implement a solution proportionate to the level of risk, site characteristics and regulatory requirements, even where energy recovery is not technically or economically viable.

        ### Gas Collection System Design and Optimisation
        The performance of a landfill gas collection system depends on the proper design, placement and operation of wells, piping, blowers and condensate-management equipment. Biothermica designs new systems and evaluates existing installations to identify opportunities for improvement.
        Vacuum levels must be carefully balanced. Insufficient vacuum can result in fugitive methane emissions, odours and subsurface gas migration. Excessive vacuum may draw air into the waste mass, disrupt anaerobic conditions and increase fire risks.
        Biothermica helps operators adapt and optimise their collection systems as landfill conditions evolve.

        ### Landfill Gas Treatment Destruction and Utilisation
        Depending on its flow rate, composition and intended use, landfill gas may require the removal of moisture, particulates, hydrogen sulphide, siloxanes, carbon dioxide and other contaminants.
        Biothermica develops solutions suited to the selected application, whether the gas is to be vented under controlled conditions, safely destroyed, used to generate electricity or heat, or upgraded to renewable natural gas.
        The equipment is sized according to measured gas availability and projected production, helping to reduce technical and financial risks throughout the life of the project.

        ### Monitoring and Regulatory Compliance
        Ongoing monitoring is essential to maintain collection efficiency and demonstrate the landfill’s environmental performance. Biothermica assists operators with well-performance assessments, gas flow and quality measurements, leak detection, surface methane-emission surveys, data management and regulatory reporting.
        These activities make it possible to identify deficiencies, determine their causes and implement corrective measures before they affect regulatory compliance, safety or energy production.

        ### Emergency Response at Former Disposal Sites
        The unexpected discovery of landfill gas emissions from a former disposal site may pose risks to public safety, air quality and nearby buildings or infrastructure. Biothermica provides rapid-response services to assess the situation, characterise the detected gases and determine their source and extent.
        The response may include field methane measurements, an assessment of subsurface gas migration, the delineation of areas at risk and the implementation of temporary control, collection or ventilation measures. Biothermica then develops a site-specific action plan covering corrective measures, environmental monitoring and, where required, the design of a permanent gas collection and treatment system.

        ### Engineering Construction and Operation
        Biothermica provides engineering, construction, commissioning and operational support for landfill gas venting, collection, destruction and utilisation systems.
        This continuity between resource assessment, facility design and field operation supports the implementation of technically reliable, safe and economically viable solutions.
        From the initial assessment to the long-term operation of the equipment, Biothermica provides the expertise required to control methane emissions and, where conditions allow, maximise the environmental and energy value of landfill gas.


      fr: |
        Une evaluation rigoureuse de la ressource en biogaz est essentielle a tout projet visant le controle des emissions ou leur valorisation energetique. Elle contribue a la viabilite financière a long terme du projet et permet d’optimiser le dimensionnement des equipements de captage, de traitement et de production d’energie.
        Dans certains lieux d’enfouissement fermes ou de faible capacite, la production de biogaz est toutefois insuffisante pour alimenter une torchère ou un equipement de valorisation. Le biogaz est alors parfois evacue directement dans l’atmosphère, notamment par des events passifs. Ces situations necessitent egalement une evaluation afin de determiner les risques et les mesures de gestion appropriees.
        Biothermica accompagne les exploitants a toutes les etapes, depuis l’evaluation initiale de la ressource jusqu’a la conception, la construction, la mise en service et l’exploitation des installations.

        ### Evaluation de la generation de biogaz
        Grâce a une technique d’echantillonnage de surface georeference mise au point au debut des annees 1990, Biothermica peut evaluer les quantites reelles de biogaz emises dans l’atmosphère et reperer les secteurs où les emissions sont les plus importantes.
        Lorsque les resultats indiquent une presence significative de biogaz, un essai de pompage dynamique peut être realise afin de mesurer avec precision les debits disponibles, la qualite du gaz et la reponse du lieu d’enfouissement a l’application d’une depression controlee.

        ### Caracterisation du biogaz
        Des echantillons de biogaz sont preleves et analyses par des laboratoires specialises afin d’en determiner la composition chimique. Les analyses peuvent notamment porter sur les composes organochlores, les composes soufres, les chlorofluorocarbones, les siloxanes et les autres contaminants susceptibles d’être presents.
        Cette caracterisation est essentielle pour selectionner les technologies de traitement appropriees, prevenir la corrosion et proteger les equipements de captage, de destruction ou de valorisation. Elle permet egalement de mieux evaluer les risques associes aux emissions atmospheriques, aux odeurs et a la migration du biogaz.

        ### Evaluation du potentiel futur de generation de methane
        Biothermica simule la production future de biogaz a l’aide de modèles mathematiques calibres en fonction des caracteristiques du lieu et des donnees mesurees sur le terrain.
        Lors des essais de pompage dynamique, des echantillons de matières residuelles peuvent egalement être preleves et analyses en laboratoire afin d’en determiner la teneur en matières organiques. Ces donnees permettent de preciser le potentiel residuel de generation de methane et son evolution dans le temps.

        ### Evaluation du potentiel energetique et des reductions de gaz a effet de serre
        À partir des projections de production de biogaz, de sa composition et des conditions du marche de l’energie, Biothermica evalue les differentes options de valorisation. Celles-ci peuvent comprendre la production d’electricite ou de chaleur ainsi que la purification du biogaz en gaz naturel renouvelable destine a être injecte dans le reseau gazier ou utilise comme carburant.
        L’analyse permet de determiner la solution la mieux adaptee aux caracteristiques du site, d’en evaluer la faisabilite technique et financière et d’estimer les reductions potentielles d’emissions de gaz a effet de serre.

        ### Gestion des sites a faible production de biogaz
        Dans plusieurs lieux d’enfouissement fermes ou de faible capacite, la quantite de biogaz produite est insuffisante ou trop variable pour alimenter une torchère ou un equipement de valorisation de façon continue. Le biogaz peut alors être evacue directement dans l’atmosphère, notamment par des events passifs. Même a faible debit, ces rejets peuvent constituer une source d’emissions de methane, d’odeurs ou de migration souterraine.
        Biothermica evalue le debit, la composition et la repartition des emissions afin de determiner le mode de gestion le mieux adapte au site. Selon les conditions observees, les solutions peuvent comprendre l’amelioration du système d’evacuation passive, le regroupement de plusieurs points d’emission, l’utilisation d’une torchère ou d’un système de destruction adapte aux faibles debits, ainsi que le recours a des procedes d’oxydation biologique, comme les biofiltres ou les biocouvertures.
        L’objectif est de mettre en place une solution proportionnee au niveau de risque, aux caracteristiques du site et aux exigences reglementaires, même lorsque la valorisation energetique du biogaz n’est pas techniquement ou economiquement viable.

        ### Conception et optimisation des systèmes de captage
        La performance d’un système de captage depend de la conception, de la disposition et de l’exploitation adequates des puits, des conduites, des soufflantes et des equipements de gestion des condensats. Biothermica conçoit de nouveaux systèmes et evalue les installations existantes afin d’en ameliorer le rendement.
        La depression appliquee au reseau doit être soigneusement equilibree. Une aspiration insuffisante peut entraîner des emissions fugitives de methane, des odeurs et la migration du biogaz. Une aspiration excessive risque, quant a elle, de faire penetrer de l’air dans la masse de matières residuelles, de perturber les conditions anaerobies et d’accroître les risques d’incendie.
        Biothermica aide les exploitants a adapter et a optimiser leur reseau de captage en fonction de l’evolution du lieu d’enfouissement.

        ### Traitement destruction et valorisation du biogaz
        Selon son debit, sa composition et l’utilisation prevue, le biogaz peut necessiter le retrait de l’humidite, des particules, du sulfure d’hydrogène, des siloxanes, du dioxyde de carbone et d’autres contaminants.
        Biothermica developpe des solutions adaptees a l’usage retenu, qu’il s’agisse d’evacuer le biogaz de manière controlee, de le detruire de façon securitaire, de produire de l’electricite ou de la chaleur, ou encore de le purifier en gaz naturel renouvelable.
        Les equipements sont dimensionnes en fonction des quantites mesurees et des projections de production, ce qui contribue a reduire les risques techniques et financiers pendant toute la duree du projet.

        ### Surveillance et conformite reglementaire
        Une surveillance continue est essentielle pour maintenir l’efficacite du captage et demontrer la performance environnementale du lieu. Biothermica accompagne les exploitants dans l’evaluation du rendement des puits, la mesure des debits et de la qualite du biogaz, la detection des fuites, le releve des emissions de methane a la surface, la gestion des donnees et la preparation des rapports reglementaires.
        Ces activites permettent de reperer les ecarts, d’en determiner les causes et d’appliquer rapidement des mesures correctives avant qu’ils ne compromettent la conformite, la securite ou la production energetique.

        ### Intervention d’urgence sur les anciens depotoirs
        La decouverte fortuite d’emissions de biogaz provenant d’un ancien depotoir peut presenter des risques pour la securite, la qualite de l’air ainsi que les bâtiments et les infrastructures situes a proximite. Biothermica offre un service d’intervention rapide afin d’evaluer la situation, de caracteriser les gaz detectes et d’en determiner la source et l’etendue.
        L’intervention peut comprendre des mesures de methane sur le terrain, l’evaluation de la migration souterraine du biogaz, la delimitation des zones a risque ainsi que la mise en place de mesures temporaires de controle, de captage ou de ventilation. Biothermica elabore ensuite un plan d’action adapte au site, incluant les mesures correctives, le suivi environnemental et, au besoin, la conception d’un système permanent de captage et de traitement.

        ### Ingenierie construction et exploitation
        Biothermica offre des services d’ingenierie, de construction, de mise en service et de soutien a l’exploitation des systèmes d’evacuation, de captage, de destruction et de valorisation du biogaz.
        Cette continuite entre l’evaluation de la ressource, la conception des installations et leur exploitation favorise la mise en œuvre de solutions techniquement fiables, securitaires et economiquement viables.
        De l’evaluation initiale jusqu’a l’exploitation a long terme des equipements, Biothermica reunit les expertises necessaires pour controler les emissions de methane et maximiser, lorsque les conditions le permettent, la valeur environnementale et energetique du biogaz.
