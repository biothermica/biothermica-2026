    text:
      en: |
        A rigorous assessment of the landfill gas resource is essential to any project aimed at controlling emissions or recovering energy. It supports the project’s long-term financial viability and enables the proper sizing of gas collection, treatment and energy-production equipment.

        At some closed or small-capacity landfill sites, however, gas production is insufficient to operate a flare or utilisation system. The landfill gas may then be released directly into the atmosphere, particularly through passive vents. These situations also require an assessment to determine the associated risks and appropriate management measures.

        Biothermica supports landfill operators at every stage, from the initial resource assessment to the design, construction, commissioning and operation of the facilities.

        ### Landfill Gas Generation Assessment

        Using a georeferenced surface-sampling technique developed in the early 1990s, Biothermica can assess the actual quantities of landfill gas released into the atmosphere and identify areas where emissions are most significant.

        When the results indicate a substantial landfill gas resource, a dynamic pumping test can be conducted to accurately measure the available gas flow, gas quality and the landfill’s response to controlled vacuum conditions.

        ### Landfill Gas Characterisation

        Landfill gas samples are collected and analysed by specialised laboratories to determine their chemical composition. Testing may cover organochlorine compounds, sulphur compounds, chlorofluorocarbons, siloxanes and other contaminants that may be present.

        This characterisation is essential for selecting the appropriate treatment technologies, preventing corrosion and protecting gas collection, destruction and utilisation equipment. It also supports a more accurate assessment of the risks associated with atmospheric emissions, odours and landfill gas migration.

        ### Future Methane Generation Potential

        Biothermica forecasts future landfill gas production using mathematical models calibrated to the site’s characteristics and field measurements.

        During dynamic pumping tests, waste samples may also be collected and analysed to determine their organic-matter content. These data provide a more accurate assessment of the remaining methane-generation potential and how it is expected to evolve over time.

        ### Energy-Recovery and Greenhouse Gas Reduction Potential

        Based on projected landfill gas production, gas composition and energy market conditions, Biothermica evaluates the available utilisation options. These may include the production of electricity or heat and the upgrading of landfill gas into renewable natural gas for pipeline injection or use as a vehicle fuel.

        The analysis identifies the solution best suited to the site, evaluates its technical and financial feasibility and estimates the potential reduction in greenhouse gas emissions.

        ### Management of Low-Production Landfill Gas Sites

        At many closed or small-capacity landfill sites, gas production is insufficient or too variable to operate a flare or energy-recovery system continuously. Landfill gas may therefore be released directly into the atmosphere, particularly through passive vents. Even at low flow rates, these releases may represent a source of methane emissions, odours or subsurface gas migration.

        Biothermica assesses the flow rate, composition and distribution of emissions to determine the management approach best suited to the site. Depending on site conditions, potential solutions may include improvements to the passive venting system, consolidation of multiple emission points, the use of a flare or destruction system designed for low gas flows, or biological oxidation systems such as biofilters and biocovers.

        The objective is to implement a solution proportionate to the level of risk, site characteristics and regulatory requirements, even where energy recovery is not technically or economically viable.

        ### Gas Collection System Design and Optimisation

        The performance of a landfill gas collection system depends on the proper design, placement and operation of wells, piping, blowers and condensate-management equipment. Biothermica designs new systems and evaluates existing installations to identify opportunities for improvement.

        Vacuum levels must be carefully balanced. Insufficient vacuum can result in fugitive methane emissions, odours and subsurface gas migration. Excessive vacuum may draw air into the waste mass, disrupt anaerobic conditions and increase fire risks.

        Biothermica helps operators adapt and optimise their collection systems as landfill conditions evolve.

        ### Landfill Gas Treatment Destruction and Utilisation

        Depending on its flow rate, composition and intended use, landfill gas may require the removal of moisture, particulates, hydrogen sulphide, siloxanes, carbon dioxide and other contaminants.

        Biothermica develops solutions suited to the selected application, whether the gas is to be vented under controlled conditions, safely destroyed, used to generate electricity or heat, or upgraded to renewable natural gas.

        The equipment is sized according to measured gas availability and projected production, helping to reduce technical and financial risks throughout the life of the project.

        ### Monitoring and Regulatory Compliance

        Ongoing monitoring is essential to maintain collection efficiency and demonstrate the landfill’s environmental performance. Biothermica assists operators with well-performance assessments, gas flow and quality measurements, leak detection, surface methane-emission surveys, data management and regulatory reporting.

        These activities make it possible to identify deficiencies, determine their causes and implement corrective measures before they affect regulatory compliance, safety or energy production.

        ### Emergency Response at Former Disposal Sites

        The unexpected discovery of landfill gas emissions from a former disposal site may pose risks to public safety, air quality and nearby buildings or infrastructure. Biothermica provides rapid-response services to assess the situation, characterise the detected gases and determine their source and extent.

        The response may include field methane measurements, an assessment of subsurface gas migration, the delineation of areas at risk and the implementation of temporary control, collection or ventilation measures. Biothermica then develops a site-specific action plan covering corrective measures, environmental monitoring and, where required, the design of a permanent gas collection and treatment system.

        ### Engineering Construction and Operation

        Biothermica provides engineering, construction, commissioning and operational support for landfill gas venting, collection, destruction and utilisation systems.

        This continuity between resource assessment, facility design and field operation supports the implementation of technically reliable, safe and economically viable solutions.

        From the initial assessment to the long-term operation of the equipment, Biothermica provides the expertise required to control methane emissions and, where conditions allow, maximise the environmental and energy value of landfill gas.

      fr: |
        Une évaluation rigoureuse de la ressource en biogaz est essentielle à tout projet visant le contrôle des émissions ou leur valorisation énergétique. Elle contribue à la viabilité financière à long terme du projet et permet d’optimiser le dimensionnement des équipements de captage, de traitement et de production d’énergie.

        Dans certains lieux d’enfouissement fermés ou de faible capacité, la production de biogaz est toutefois insuffisante pour alimenter une torchère ou un équipement de valorisation. Le biogaz est alors parfois évacué directement dans l’atmosphère, notamment par des évents passifs. Ces situations nécessitent également une évaluation afin de déterminer les risques et les mesures de gestion appropriées.

        Biothermica accompagne les exploitants à toutes les étapes, depuis l’évaluation initiale de la ressource jusqu’à la conception, la construction, la mise en service et l’exploitation des installations.

        ### Évaluation de la génération de biogaz

        Grâce à une technique d’échantillonnage de surface géoréférencé mise au point au début des années 1990, Biothermica peut évaluer les quantités réelles de biogaz émises dans l’atmosphère et repérer les secteurs où les émissions sont les plus importantes.

        Lorsque les résultats indiquent une présence significative de biogaz, un essai de pompage dynamique peut être réalisé afin de mesurer avec précision les débits disponibles, la qualité du gaz et la réponse du lieu d’enfouissement à l’application d’une dépression contrôlée.

        ### Caractérisation du biogaz

        Des échantillons de biogaz sont prélevés et analysés par des laboratoires spécialisés afin d’en déterminer la composition chimique. Les analyses peuvent notamment porter sur les composés organochlorés, les composés soufrés, les chlorofluorocarbones, les siloxanes et les autres contaminants susceptibles d’être présents.

        Cette caractérisation est essentielle pour sélectionner les technologies de traitement appropriées, prévenir la corrosion et protéger les équipements de captage, de destruction ou de valorisation. Elle permet également de mieux évaluer les risques associés aux émissions atmosphériques, aux odeurs et à la migration du biogaz.

        ### Évaluation du potentiel futur de génération de méthane

        Biothermica simule la production future de biogaz à l’aide de modèles mathématiques calibrés en fonction des caractéristiques du lieu et des données mesurées sur le terrain.

        Lors des essais de pompage dynamique, des échantillons de matières résiduelles peuvent également être prélevés et analysés en laboratoire afin d’en déterminer la teneur en matières organiques. Ces données permettent de préciser le potentiel résiduel de génération de méthane et son évolution dans le temps.

        ### Évaluation du potentiel énergétique et des réductions de gaz à effet de serre

        À partir des projections de production de biogaz, de sa composition et des conditions du marché de l’énergie, Biothermica évalue les différentes options de valorisation. Celles-ci peuvent comprendre la production d’électricité ou de chaleur ainsi que la purification du biogaz en gaz naturel renouvelable destiné à être injecté dans le réseau gazier ou utilisé comme carburant.

        L’analyse permet de déterminer la solution la mieux adaptée aux caractéristiques du site, d’en évaluer la faisabilité technique et financière et d’estimer les réductions potentielles d’émissions de gaz à effet de serre.

        ### Gestion des sites à faible production de biogaz

        Dans plusieurs lieux d’enfouissement fermés ou de faible capacité, la quantité de biogaz produite est insuffisante ou trop variable pour alimenter une torchère ou un équipement de valorisation de façon continue. Le biogaz peut alors être évacué directement dans l’atmosphère, notamment par des évents passifs. Même à faible débit, ces rejets peuvent constituer une source d’émissions de méthane, d’odeurs ou de migration souterraine.

        Biothermica évalue le débit, la composition et la répartition des émissions afin de déterminer le mode de gestion le mieux adapté au site. Selon les conditions observées, les solutions peuvent comprendre l’amélioration du système d’évacuation passive, le regroupement de plusieurs points d’émission, l’utilisation d’une torchère ou d’un système de destruction adapté aux faibles débits, ainsi que le recours à des procédés d’oxydation biologique, comme les biofiltres ou les biocouvertures.

        L’objectif est de mettre en place une solution proportionnée au niveau de risque, aux caractéristiques du site et aux exigences réglementaires, même lorsque la valorisation énergétique du biogaz n’est pas techniquement ou économiquement viable.

        ### Conception et optimisation des systèmes de captage

        La performance d’un système de captage dépend de la conception, de la disposition et de l’exploitation adéquates des puits, des conduites, des soufflantes et des équipements de gestion des condensats. Biothermica conçoit de nouveaux systèmes et évalue les installations existantes afin d’en améliorer le rendement.

        La dépression appliquée au réseau doit être soigneusement équilibrée. Une aspiration insuffisante peut entraîner des émissions fugitives de méthane, des odeurs et la migration du biogaz. Une aspiration excessive risque, quant à elle, de faire pénétrer de l’air dans la masse de matières résiduelles, de perturber les conditions anaérobies et d’accroître les risques d’incendie.

        Biothermica aide les exploitants à adapter et à optimiser leur réseau de captage en fonction de l’évolution du lieu d’enfouissement.

        ### Traitement destruction et valorisation du biogaz

        Selon son débit, sa composition et l’utilisation prévue, le biogaz peut nécessiter le retrait de l’humidité, des particules, du sulfure d’hydrogène, des siloxanes, du dioxyde de carbone et d’autres contaminants.

        Biothermica développe des solutions adaptées à l’usage retenu, qu’il s’agisse d’évacuer le biogaz de manière contrôlée, de le détruire de façon sécuritaire, de produire de l’électricité ou de la chaleur, ou encore de le purifier en gaz naturel renouvelable.

        Les équipements sont dimensionnés en fonction des quantités mesurées et des projections de production, ce qui contribue à réduire les risques techniques et financiers pendant toute la durée du projet.

        ### Surveillance et conformité réglementaire

        Une surveillance continue est essentielle pour maintenir l’efficacité du captage et démontrer la performance environnementale du lieu. Biothermica accompagne les exploitants dans l’évaluation du rendement des puits, la mesure des débits et de la qualité du biogaz, la détection des fuites, le relevé des émissions de méthane à la surface, la gestion des données et la préparation des rapports réglementaires.

        Ces activités permettent de repérer les écarts, d’en déterminer les causes et d’appliquer rapidement des mesures correctives avant qu’ils ne compromettent la conformité, la sécurité ou la production énergétique.

        ### Intervention d’urgence sur les anciens dépotoirs

        La découverte fortuite d’émissions de biogaz provenant d’un ancien dépotoir peut présenter des risques pour la sécurité, la qualité de l’air ainsi que les bâtiments et les infrastructures situés à proximité. Biothermica offre un service d’intervention rapide afin d’évaluer la situation, de caractériser les gaz détectés et d’en déterminer la source et l’étendue.

        L’intervention peut comprendre des mesures de méthane sur le terrain, l’évaluation de la migration souterraine du biogaz, la délimitation des zones à risque ainsi que la mise en place de mesures temporaires de contrôle, de captage ou de ventilation. Biothermica élabore ensuite un plan d’action adapté au site, incluant les mesures correctives, le suivi environnemental et, au besoin, la conception d’un système permanent de captage et de traitement.

        ### Ingénierie construction et exploitation

        Biothermica offre des services d’ingénierie, de construction, de mise en service et de soutien à l’exploitation des systèmes d’évacuation, de captage, de destruction et de valorisation du biogaz.

        Cette continuité entre l’évaluation de la ressource, la conception des installations et leur exploitation favorise la mise en œuvre de solutions techniquement fiables, sécuritaires et économiquement viables.

        De l’évaluation initiale jusqu’à l’exploitation à long terme des équipements, Biothermica réunit les expertises nécessaires pour contrôler les émissions de méthane et maximiser, lorsque les conditions le permettent, la valeur environnementale et énergétique du biogaz.
