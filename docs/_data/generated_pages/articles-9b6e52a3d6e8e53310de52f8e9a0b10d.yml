  title: Vente des actifs de Gazmont au Groupe Helios
  title_en: Sale of Gazmont assets to Groupe Helios
  mydate: "2016-05-19"
  body: "Montr\xE9al, le 24 f\xE9vrier 2016 \u2014 Biothermica annonce la vente au
    Groupe Helios de sa participation dans la soci\xE9t\xE9 en commandite Gazmont,
    propri\xE9taire de la centrale au biogaz situ\xE9e sur le site de l'ancienne carri\xE8re
    Miron \xE0 Montr\xE9al. Op\xE9rateur de la centrale Gazmont depuis 1996, le Groupe
    Helios est sp\xE9cialis\xE9 en gestion d'infrastructures urbaines.\n\xABC'est
    une page marquante de notre histoire que nous tournons aujourd'hui\xBB, explique
    M. Guy Drouin, pr\xE9sident de Biothermica. D\xE8s 1987, Biothermica et ses partenaires
    ont d\xE9velopp\xE9 et mis en place le projet de valorisation des biogaz provenant
    du site d'enfouissement de Montr\xE9al, qui s'est concr\xE9tis\xE9 par la mise
    en service d'une centrale \xE9lectrique de 25 MW en juin 1996, la plus importante
    du genre au Canada.\n\xABNous sommes fiers de ce projet novateur qui s'est av\xE9r\xE9
    une v\xE9ritable vitrine technologique en plein c\u0153ur de Montr\xE9al. Nous
    avons choisi de nous d\xE9partir de cet actif afin de nous concentrer sur des
    projets \xE9ligibles au march\xE9 du carbone, tel que pr\xE9vu dans notre plan
    d'affaires 2016-2020. En effet, comme le march\xE9 du carbone est appel\xE9 \xE0
    se d\xE9velopper de mani\xE8re consid\xE9rable suite \xE0 l'Accord de Paris sur
    les changements climatiques, il repr\xE9sente une opportunit\xE9 d'affaires \xE0
    saisir\xBB, a d\xE9clar\xE9 M. Guy Drouin.\nRappelons que Biothermica a \xE9t\xE9
    la premi\xE8re entreprise qu\xE9b\xE9coise \xE0 g\xE9n\xE9rer la vente de cr\xE9dits
    carbone sur le march\xE9 du carbone Qu\xE9bec-Californie. Ces cr\xE9dits proviennent
    d'un projet de destruction de m\xE9thane dans une mine de charbon de la compagnie
    Jim Walter Resources (JWR) \xE0 Brookwood, en Alabama. Cette premi\xE8re ouvre
    la voie \xE0 plusieurs autres projets similaires au Canada.\nBiothermica compte
    prioriser son action dans ce secteur au Canada, aux \xC9tats-Unis, en Australie,
    en Chine et au Kazakhstan afin de contribuer aux efforts de r\xE9duction des GES
    tels que souhait\xE9s par l'Accord de Paris sur les changements climatiques."
  body_en: "Montreal, February 24, 2016 \u2014 Biothermica, owner of the biogas power
    plant located on the site of the former Miron quarry in Montreal, announces the
    sale of its interests in the Gazmont limited partnership to Groupe Helios.  Gazmont
    operator of the plant since 1996, Groupe Helios specializes in the management
    of urban infrastructures.\n\"This is a significant page of our history that we
    turn today\", said Mr Guy Drouin, President of Biothermica.  In 1987, Biothermica
    and her partners have developed and implemented the valorization project for the
    biogas from the Montreal landfill site, which materialized by the commissionning
    of a 25 MW power plant in June of 1996, the largest of its kind in Canada.\n\"We
    are proud of this innovative project that turned to be a technological showcase
    in the heart of Montreal.  We have chosen to divest of these assets in order to
    focus on eligible projects on the carbon market, as planned in our 2016-2020 business
    plan.  In fact, as the carbon market is expected to grow significantly following
    the Paris Agreement on Climate Change, it represents a business opportunity to
    seize\", said Mr. Guy Drouin, President of Biothermica.\nLet's remember that Biothermica
    was the first Quebec company to generate the sale of carbon credits on the Quebec-California
    carbon market.  These carbon credits come from a methane destruction project on
    a coal mine from Jim Walter Resources (JWR) company in Brookwood, Alabama.  This
    first opens the way for several other similar projects in Canada, while Quebec
    has just recognized as eligible for its own carbon market for this type of project
    carried out across Canada.\nBiothermica considers to prioritize its work in this
    sector in Canada, the US, Australia, China and Kazakhstan and so participate in
    GHG reduction efforts as desired by the Paris Agreement on Climate Change."
