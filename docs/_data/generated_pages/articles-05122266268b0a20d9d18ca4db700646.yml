  text:
    en: "## Montreal, March 25, 2014 ## \u2014 Biothermica announced the signing of
      an electricity sales agreement with Hydro-Qu\xE9bec Distribution under the *Program
      for the Purchase of Electricity from Cogeneration Plants Using Residual Forest
      Biomass*.\nThis 25-year contract, concluded by its affiliate Biomont \xC9nergie
      Inc., will ensure continued electricity production from biomass buried at the
      Miron quarry landfill site, located within the Saint-Michel Environmental Complex
      in Montreal.\nThe $15 million project will involve major upgrades to the Gazmont
      plant, which has been valorizing biogas since 1996. A more efficient production
      process will replace the current one, taking into account declining biogas volumes
      following the end of organic waste landfilling in 2000.\nThe project also includes
      expanding the district heating network that has supplied TOHU since 2004 to
      include Cirque du Soleil\u2019s headquarters, improving energy efficiency and
      reducing greenhouse gas emissions.\nThe Gazmont plant is currently shut down,
      with operations expected to resume in fall 2015. Approximately 750 million kWh
      of green energy will be produced over the life of the project.\nSince 1996,
      the 25 MW Gazmont facility has destroyed landfill biogas, producing over two
      billion kWh of green energy and reducing emissions by approximately 10 million
      tCO\u2082e.\n## About Biothermica\nFounded in 1987, Biothermica is a leader
      in the development, financing, construction, and operation of methane destruction
      projects from landfills and underground coal mines. The company also markets
      carbon credits and electricity internationally.\nwww.biothermica.com\n## Information:\nLeila
      Copti   Copticom   (514) 661-6134   copti@copticom.ca  "
