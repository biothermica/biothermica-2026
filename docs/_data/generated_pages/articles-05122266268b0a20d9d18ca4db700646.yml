  title: "Biothermica annonce la signature d\u2019un contrat de vente d\u2019\xE9lectricit\xE9
    avec Hydro-Qu\xE9bec Distribution"
  title_en: Biothermica announces signature of an electricity sales contract with
    Hydro-Quebec Distribution (French)
  mydate: "2014-03-25"
  body: "## Montr\xE9al, le 25 mars 2014 ## \u2014 Biothermica a aujourd\u2019hui
    annonc\xE9 la signature d\u2019un contrat de vente d\u2019\xE9lectricit\xE9 avec
    Hydro-Qu\xE9bec Distribution, dans le cadre du *Programme d\u2019achat d\u2019\xE9lectricit\xE9
    provenant de centrales de cog\xE9n\xE9ration \xE0 base de biomasse foresti\xE8re
    r\xE9siduelle*.\nCe contrat d\u2019une dur\xE9e de vingt-cinq ans, conclu par
    une soci\xE9t\xE9 affili\xE9e \xE0 Biothermica, Biomont \xC9nergie Inc., permettra
    de p\xE9renniser la production d\u2019\xE9lectricit\xE9 \xE0 partir de la biomasse
    enfouie dans le site d\u2019enfouissement de la carri\xE8re Miron, situ\xE9e au
    sein du Complexe environnemental Saint-Michel, \xE0 Montr\xE9al.\nLe projet, au
    co\xFBt de 15 millions de dollars, consistera \xE0 apporter d\u2019importantes
    modifications \xE0 la centrale existante Gazmont, qui valorise depuis 1996 le
    biogaz g\xE9n\xE9r\xE9 par le site d\u2019enfouissement de la Ville. Le proc\xE9d\xE9
    actuel de production d\u2019\xE9lectricit\xE9 sera remplac\xE9 par un proc\xE9d\xE9
    beaucoup plus efficace, tenant compte de la diminution observ\xE9e des quantit\xE9s
    de biogaz au cours des dix derni\xE8res ann\xE9es, en raison de la fin des activit\xE9s
    d\u2019enfouissement des mati\xE8res putrescibles en 2000.\nLe projet comprendra
    \xE9galement l\u2019extension du r\xE9seau actuel de chauffage urbain, qui alimente
    la TOHU depuis 2004, pour y inclure le si\xE8ge social du Cirque du Soleil, permettant
    des gains \xE9nerg\xE9tiques importants et une r\xE9duction des gaz \xE0 effet
    de serre.\nLa centrale Gazmont est actuellement en arr\xEAt de production et les
    op\xE9rations devraient reprendre \xE0 l\u2019automne 2015, une fois les autorisations
    obtenues. Environ 750 millions de kWh d\u2019\xE9nergie verte seront produits
    sur vingt-cinq ans.\nDepuis 1996, la centrale Gazmont, d\u2019une capacit\xE9
    de 25 MW, d\xE9truit le biogaz \xE9mis par l\u2019ancien site d\u2019enfouissement
    de Montr\xE9al. Elle a permis la production de plus de deux milliards de kWh d\u2019\xE9nergie
    verte et des r\xE9ductions cumulatives d\u2019environ 10 millions tCO\u2082e.
    Elle constitue une vitrine technologique importante du savoir-faire qu\xE9b\xE9cois
    en technologies propres.\n## Au sujet de Biothermica\nFond\xE9e en 1987, Biothermica
    est un chef de file dans le d\xE9veloppement, le financement, la construction
    et l\u2019op\xE9ration de projets de destruction de m\xE9thane provenant des sites
    d\u2019enfouissement et des mines de charbon souterraines. L\u2019entreprise commercialise
    \xE9galement des cr\xE9dits carbone et de l\u2019\xE9lectricit\xE9 sur les march\xE9s
    domestiques et internationaux.\nwww.biothermica.com\n## Renseignements :\nLeila
    Copti   Copticom   (514) 661-6134   lcopti@copticom.ca  "
  body_en: "## Montreal, March 25, 2014 ## \u2014 Biothermica announced the signing
    of an electricity sales agreement with Hydro-Qu\xE9bec Distribution under the
    *Program for the Purchase of Electricity from Cogeneration Plants Using Residual
    Forest Biomass*.\nThis 25-year contract, concluded by its affiliate Biomont \xC9nergie
    Inc., will ensure continued electricity production from biomass buried at the
    Miron quarry landfill site, located within the Saint-Michel Environmental Complex
    in Montreal.\nThe $15 million project will involve major upgrades to the Gazmont
    plant, which has been valorizing biogas since 1996. A more efficient production
    process will replace the current one, taking into account declining biogas volumes
    following the end of organic waste landfilling in 2000.\nThe project also includes
    expanding the district heating network that has supplied TOHU since 2004 to include
    Cirque du Soleil\u2019s headquarters, improving energy efficiency and reducing
    greenhouse gas emissions.\nThe Gazmont plant is currently shut down, with operations
    expected to resume in fall 2015. Approximately 750 million kWh of green energy
    will be produced over the life of the project.\nSince 1996, the 25 MW Gazmont
    facility has destroyed landfill biogas, producing over two billion kWh of green
    energy and reducing emissions by approximately 10 million tCO\u2082e.\n## About
    Biothermica\nFounded in 1987, Biothermica is a leader in the development, financing,
    construction, and operation of methane destruction projects from landfills and
    underground coal mines. The company also markets carbon credits and electricity
    internationally.\nwww.biothermica.com\n## Information:\nLeila Copti   Copticom
    \  (514) 661-6134   copti@copticom.ca  "
