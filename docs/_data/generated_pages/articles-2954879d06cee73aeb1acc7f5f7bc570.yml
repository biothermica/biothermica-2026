      mission is to recover and mitigate VAM emissions from all current and future
      suitable ventilation shafts at Walter Energy\u2019s coal mines.\nThe first project
      under the agreement is planned to be operational in 2011, reducing greenhouse
      gas emissions by 330,000 tons of CO2 equivalent (tCO2e) per year. Ultimately,
      the implementation of the entire pipeline of projects is expected to reduce
      emissions by more than 3 million tCO2e per year.\n\u201CToday more than ever,
      environmental considerations cannot be ignored and must be addressed,\u201D
      said Rich Donnelly, Walter Energy\u2019s Vice President Engineering. \u201CThis
      ambitious initiative positions Walter Energy as an industry leader. The tangible
      steps we are taking today prepare our company for tomorrow\u2019s challenges
      and ultimately will make us more competitive.\u201D\nUpcoming VAM oxidation
      projects will utilize Biothermica\u2019s proprietary VAMOX\xAE technology, which
      has been successfully demonstrated at Walter Energy No.4 Mine. Operational since
      March 2009, this demonstration project currently reduces greenhouse gas emissions
      by approximately 35,000 tCO2e per year.\n\u201CWe are thrilled to strengthen
      our relationship with one of the leading and most successful coal mine operators
      in the United States,\u201D said Guy Drouin, President of Biothermica. \u201COur
      integrated and proven VAM abatement project capabilities, combined with Walter
      Energy\u2019s forward-looking vision and large VAM potential, will ensure the
      venture\u2019s success.\u201D\nVAM constitutes 60% to 70% of all underground
      coal mine methane emissions. Worldwide, about 300 million tCO2e are emitted
      by underground mine ventilation systems each year. With 40 million tCO2e per
      year, the US is the second largest contributor.\n##About Walter Energy##\nWalter
      Energy is a leading U.S. producer and exporter of premium hard coking coal for
      the global steel industry and also produces steam coal and industrial coal,
      metallurgical coke and coal bed methane gas. The Company has revenues of approximately
      $1.0 billion and employs approximately 2,100 people. For more information, visit
      [www.walterenergy.com](http://www.walterenergy.com).\n## About Biothermica\nFounded
      in 1987, Biothermica is a leader in the development, financing, building and
      operation of projects which capture and destroy methane emitted by landfill
      sites and underground coal mines. As a fully integrated project developer, the
      company also monetizes the carbon offset credits generated by its projects on
