  title: "Biothermica et Walter Energy signent un accord pour le d\xE9veloppement
    de projets de m\xE9thane minier"
  title_en: Biothermica and Walter Energy Agree to Develop Ventilation Air Methane
    Projects
  mydate: "2010-10-05"
  body: "## Birmingham, Alabama, 5 Octobre, 2010 ## \u2013 Biothermica Coal Carbon
    Corp. et Walter Energy ont aujourd\u2019hui annonc\xE9 la signature d\u2019un
    accord d\xE9di\xE9 au d\xE9veloppement de projets d\u2019oxydation du m\xE9thane
    contenu dans l\u2019air de ventilation des mines de charbon souterraines (\xAB
    Ventilation Air Methane \xBB ou VAM). Cet accord encadre la r\xE9cup\xE9ration
    et la destruction des \xE9missions de VAM des puits de ventilation existants et
    \xE0 venir des mines de Walter Energy.\nLa mise en op\xE9ration d\u2019un premier
    projet est pr\xE9vue pour 2011, r\xE9duisant ainsi les \xE9missions de gaz \xE0
    effet de serre d\u2019environ 330,000 tonnes de CO2 \xE9quivalent (tCO2e) par
    ann\xE9e. Ultimement, la mise en place de l\u2019ensemble des projets pr\xE9vus
    par cet accord engendrera des r\xE9ductions d\u2019\xE9missions de plus de 3 millions
    de tCO2e par an, soit l\u2019\xE9quivalent des \xE9missions annuelles de plus
    de 500,000 voitures.\n\xAB Aujourd\u2019hui plus que jamais, les consid\xE9rations
    environnementales ne peuvent \xEAtre ignor\xE9es et doivent \xEAtre adress\xE9es
    \xBB a expliqu\xE9 Rich Donnelly, Vice-Pr\xE9sident Ing\xE9nierie de Walter Energy.
    \xAB Cette initiative ambitieuse positionne Walter Energy en tant que chef de
    file. Les actions concr\xE8tes que nous r\xE9alisons aujourd\u2019hui pr\xE9parent
    notre compagnie pour les d\xE9fis \xE0 venir et nous rendront ultimement plus
    comp\xE9titifs \xBB.\nLes projets seront bas\xE9s sur la technologie VAMOX\xAE
    de Biothermica, d\xE9velopp\xE9e avec succ\xE8s sur l\u2019un des puits de ventilation
    de la mine No. 4 de Walter Energy. Une unit\xE9 de d\xE9monstration y est en effet
    op\xE9rationnelle depuis mars 2009, r\xE9duisant les gaz \xE0 effet de serre d\u2019approximativement
    35,000 tCO2e par an.\n\xAB Cet accord constitue le prolongement naturel de notre
    collaboration avec Walter Energy depuis 2007 \xBB a indiqu\xE9 Guy Drouin, Pr\xE9sident
    de Biothermica. \xAB Notre expertise int\xE9gr\xE9e et reconnue, ainsi que l\u2019avant-gardisme
    et le savoir-faire de Walter Energy, sont garants du succ\xE8s de cette initiative
    \xBB.\nLes \xE9missions de VAM repr\xE9sentent entre 60% et 70% des \xE9missions
    des mines de charbon souterraines. Chaque ann\xE9e, pr\xE8s de 300 million de
    tCO2e sont \xE9mises \xE0 travers le monde par leurs syst\xE8mes de ventilation.
    Avec pr\xE8s de 40 million de tCO2e par an, les \xC9tats-Unis sont en deuxi\xE8me
    position quant aux \xE9missions nationales de VAM.\n## Au sujet de Walter Energy\nWalter
    Energy est un des plus importants producteurs et exportateurs de charbon \xE0
    coke destin\xE9 \xE0 l\u2019industrie mondiale de l\u2019acier. L\u2019entreprise
    produit \xE9galement d\u2019autres cat\xE9gories de charbon, incluant du charbon
    \xE0 vapeur, industriel ou m\xE9tallurgique, ainsi que du gaz minier provenant
    des veines de charbon souterraines. Walter Energy emploie pr\xE8s de 2,100 personnes,
    ses revenus s\u2019\xE9levant \xE0 environ $US 1.0 milliard. [www.walterenergy.com](http://www.walterenergy.com)\n##
    Au sujet de Biothermica\nFond\xE9e en 1987, Biothermica est un chef de file dans
    le d\xE9veloppement, le financement, la construction et l\u2019op\xE9ration de
    projets de destruction de m\xE9thane \xE9mis par les sites d\u2019enfouissement
    et les mines de charbon souterraines. En tant que d\xE9veloppeur int\xE9gr\xE9,
    l\u2019entreprise commercialise \xE9galement les cr\xE9dits de carbone g\xE9n\xE9r\xE9s
    par ses projets sur les march\xE9s internationaux. Biothermica a r\xE9alis\xE9
    des projets carbone en Am\xE9rique du Nord et en Am\xE9rique centrale. [www.biothermica.com](http://www.biothermica.com)\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 contient certaines donn\xE9es non historiques
    constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel, et notamment
    des d\xE9clarations prospectives concernant des \xE9v\xE8nements, tendances, plans
    ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur les vues et hypoth\xE8ses
    actuelles de la Direction de l\u2019entreprise et sont sujettes \xE0 des risques
    et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence entre les r\xE9sultats
    r\xE9els et ceux contenus explicitement ou implicitement dans ces d\xE9clarations."
  body_en: "##Birmingham, Alabama, October 5, 2010## \u2013 Biothermica Coal Carbon
    Corp. and Walter Energy today announced that they have made an agreement dedicated
    to the development of ventilation air methane (VAM) oxidation projects. The mission
    is to recover and mitigate VAM emissions from all current and future suitable
    ventilation shafts at Walter Energy\u2019s coal mines.\nThe first project under
    the agreement is planned to be operational in 2011, reducing greenhouse gas emissions
    by 330,000 tons of CO2 equivalent (tCO2e) per year. Ultimately, the implementation
    of the entire pipeline of projects is expected to reduce emissions by more than
    3 million tCO2e per year.\n\u201CToday more than ever, environmental considerations
    cannot be ignored and must be addressed,\u201D said Rich Donnelly, Walter Energy\u2019s
    Vice President Engineering. \u201CThis ambitious initiative positions Walter Energy
    as an industry leader. The tangible steps we are taking today prepare our company
    for tomorrow\u2019s challenges and ultimately will make us more competitive.\u201D\nUpcoming
    VAM oxidation projects will utilize Biothermica\u2019s proprietary VAMOX\xAE technology,
    which has been successfully demonstrated at Walter Energy No.4 Mine. Operational
    since March 2009, this demonstration project currently reduces greenhouse gas
    emissions by approximately 35,000 tCO2e per year.\n\u201CWe are thrilled to strengthen
    our relationship with one of the leading and most successful coal mine operators
    in the United States,\u201D said Guy Drouin, President of Biothermica. \u201COur
    integrated and proven VAM abatement project capabilities, combined with Walter
    Energy\u2019s forward-looking vision and large VAM potential, will ensure the
    venture\u2019s success.\u201D\nVAM constitutes 60% to 70% of all underground coal
    mine methane emissions. Worldwide, about 300 million tCO2e are emitted by underground
    mine ventilation systems each year. With 40 million tCO2e per year, the US is
    the second largest contributor.\n##About Walter Energy##\nWalter Energy is a leading
    U.S. producer and exporter of premium hard coking coal for the global steel industry
    and also produces steam coal and industrial coal, metallurgical coke and coal
    bed methane gas. The Company has revenues of approximately $1.0 billion and employs
    approximately 2,100 people. For more information, visit [www.walterenergy.com](http://www.walterenergy.com).\n##
    About Biothermica\nFounded in 1987, Biothermica is a leader in the development,
    financing, building and operation of projects which capture and destroy methane
    emitted by landfill sites and underground coal mines. As a fully integrated project
    developer, the company also monetizes the carbon offset credits generated by its
    projects on the international markets. Biothermica has completed carbon projects
    in North and Central America. For more information, visit [www.biothermica.com](/index/).\n##
    Disclaimer\nWhen reviewing this information consider that it was reported as of
    the date listed, reflecting management views as of that date. It should also be
    considered in the context of the circumstances prevailing at that time and is
    only correct as of that date. The information can contain forward looking statements
    that are subject to known and unknown risks and uncertainties that could cause
    actual results to differ materially from those expressed or implied by such statements."
