  title: "Projet de destruction du m\xE9thane issu d\u2019une mine de charbon maintenant
    op\xE9rationnel, une premi\xE8re en Am\xE9rique"
  title_en: Coal mine methane destruction project now operational, a first in America
  mydate: "2009-04-20"
  body: "## Montr\xE9al, Canada, le 20 avril 2009 ## \u2013 Biothermica, compagnie
    qu\xE9b\xE9coise reconnue dans le domaine des technologies environnementales,
    a annonc\xE9 aujourd\u2019hui que son premier syst\xE8me VAMOX\u2122 d'oxydation
    du m\xE9thane contenu dans l'air de ventilation des mines de charbon est pleinement
    op\xE9rationnel. Ce VAMOX\u2122 a \xE9t\xE9 d\xE9ploy\xE9 \xE0 la mine no. 4 de
    Jim Walter Resources (JWR) en Alabama (\xC9.-U.). Pour la premi\xE8re fois en
    Am\xE9rique, des \xE9missions de gaz \xE0 effet de serre (GES) de cette cat\xE9gorie,
    appel\xE9e Ventilation Air Methane (VAM), sont d\xE9truites et valoris\xE9es en
    g\xE9n\xE9rant des cr\xE9dits de carbone.\nApprouv\xE9 par la Mine Safety and
    Health Administration (MSHA) du U.S. Department of Labor, le syst\xE8me a oxyd\xE9
    du m\xE9thane pour la premi\xE8re fois le 26 janvier 2009 dans le respect de l\u2019\xE9ch\xE9ancier
    initial. Capturant et traitant un d\xE9bit d'air de ventilation de 30 000 pi\xB3/minute,
    cette unit\xE9 de d\xE9monstration va engendrer des r\xE9ductions d\u2019\xE9missions
    de GES de pr\xE8s de 40 000 tonnes de CO2 \xE9quivalent (tCO2e) par ann\xE9e,
    ce qui \xE9quivaut \xE0 supprimer 8 000 voitures de nos routes.\nEn 2008, les
    \xE9missions de VAM repr\xE9sentaient environ 5% des \xE9missions globales de
    m\xE9thane d\u2019origine humaine, soit approximativement 300 millions de tCO2e.
    Apr\xE8s la Chine, les \xC9tats-Unis en sont le 2e plus grand \xE9metteur, \xE0
    hauteur de 15% de ce total.\n\xAB Nous sommes extr\xEAmement satisfaits de la
    performance et de la fiabilit\xE9 du VAMOX\u2122 apr\xE8s seulement quelques semaines
    d\u2019op\xE9ration\xBB a indiqu\xE9 Nicolas Duplessis, Directeur du d\xE9veloppement
    du VAMOX\u2122. Guy Drouin, Pr\xE9sident de Biothermica, a ajout\xE9 : \xAB L\u2019air
    de ventilation des mines de charbon repr\xE9sente 50 \xE0 70% de leurs \xE9missions
    de m\xE9thane. Le VAMOX\u2122 peut tr\xE8s certainement aider l\u2019industrie
    du charbon \xE0 minimiser son impact environnemental. En ce sens, nous projetons
    de d\xE9velopper des projets similaires en partenariat avec d\u2019autres mines
    am\xE9ricaines. \xBB\nReconnu en tant que d\xE9veloppeur accompli de projets de
    r\xE9duction des \xE9missions de GES, Biothermica vise toujours la production
    de cr\xE9dits de carbone de haute qualit\xE9. Le projet chez JWR est ainsi valid\xE9
    en conformit\xE9 avec le Voluntary Carbon Standard (VCS) et est l\u2019un des
    premiers \xE0 \xEAtre enregistr\xE9 sur le nouveau APX VCS Registry. [www.vcsregistry.com](http://www.vcsregistry.com)\n\xAB
    Jim Walter Resources se positionne une nouvelle fois comme chef de file au sein
    de son industrie gr\xE2ce \xE0 l\u2019installation de cette nouvelle technologie
    qui permet une production de charbon plus propre\xBB explique Thomas E. McNider,
    Directeur g\xE9n\xE9ral de l\u2019ing\xE9nierie de la mine. \xAB Le VAMOX\u2122
    est une solution simple car il ne n\xE9cessite aucune modification \xE0 nos \xE9quipements
    existants et demeure ind\xE9pendant de notre syst\xE8me de ventilation \xBB.\nUtilisant
    le principe prouv\xE9 d\u2019oxydation thermique r\xE9g\xE9n\xE9rative (RTO),
    le VAMOX\u2122 capture et oxyde le m\xE9thane contenu dans l\u2019air de ventilation
    avant que ce puissant GES ne soit \xE9mis \xE0 l\u2019atmosph\xE8re. Fort de ses
    15 ans d\u2019exp\xE9rience appliqu\xE9e \xE0 la technologie RTO, Biothermica
    a d\xE9velopp\xE9 le VAMOX\u2122 pour offrir aux mines une solution simple et
    profitable leur permettant de diminuer significativement leur empreinte carbone.\n##
    Au sujet de Biothermica\nFond\xE9e \xE0 Montr\xE9al en 1987, Biothermica est un
    chef de file dans la conception, la construction et la livraison cl\xE9s en main
    de solutions pour le contr\xF4le de la pollution atmosph\xE9rique, la gestion
    des biogaz issu de sites d\u2019enfouissement et l\u2019oxydation du m\xE9thane
    \xE9mis par les mines de charbon. Biothermica est \xE9galement un d\xE9veloppeur
    de projets de r\xE9duction des \xE9missions de GES qui finance, structure et investit
    dans des projets techniquement pertinents. Biothermica a r\xE9alis\xE9 des projets
    en Am\xE9rique du nord, en Am\xE9rique Latine, en Asie (incluant la Chine), en
    Afrique et en Europe. [www.biothermica.com](https://www.biothermica.com)\n## Au
    sujet de Jim Walter Resources\nJim Walter Resources Inc. (JWR) est le premier
    producteur mondial de charbon Blue Creek. Reconnu mondialement aupr\xE8s des producteurs
    de charbon, le gisement Blue Creek est situ\xE9 au coeur du bassin Warrior (\xC9.-U.),
    riche en charbon. JWR fournit un charbon \xE0 teneur calorifique \xE9lev\xE9e
    et faible en soufre provenant de mines parmi les plus profondes du continent am\xE9ricain.
    Des clients pr\xE9sents sur cinq continents utilisent le charbon Blue Creek pour
    satisfaire leurs besoins aux sp\xE9cifications m\xE9tallurgiques et thermiques
    exigeantes.\n## Avertissement\nLe pr\xE9sent communiqu\xE9 contient certaines
    donn\xE9es non historiques constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel,
    et notamment des d\xE9clarations prospectives concernant des \xE9v\xE8nements,
    tendances, plans ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur
    les vues et hypoth\xE8ses actuelles de la Direction de l\u2019entreprise et sont
    sujettes \xE0 des risques et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence
    entre les r\xE9sultats r\xE9els et ceux contenus explicitement ou implicitement
    dans ces d\xE9clarations."
  body_en: "## Montreal, Canada, April 20, 2009 ## \u2013 Biothermica, a Quebec-based
    environmental technology company, announced today that its first VAMOX\u2122 system
    for the oxidation of methane contained in coal mine ventilation air is fully operational.
    This VAMOX\u2122 was deployed at Jim Walter Resources' (JWR) No. 4 mine in Alabama,
    USA. For the first time in the Americas, greenhouse gas (GHG) emissions in this
    category, called Ventilation Air Methane (VAM), are destroyed and recovered by
    generating carbon credits.\nApproved by the U.S. Department of Labor's Mine Safety
    and Health Administration (MSHA), the system oxidized methane for the first time
    on January 26, 2009 on schedule. Capturing and treating a ventilation air flow
    of 30,000 CFM, this demonstration unit will reduce GHG emissions by nearly 40,000
    tonnes of CO2 equivalent (tCO2e) per year, which is equivalent to removing 8,000
    cars from our roads.\nIn 2008, VAM emissions accounted for about 5% of global
    human-caused methane emissions, or approximately 300 million tCO2e. After China,
    the United States is the 2nd largest emitter, accounting for 15% of this total.\n\"We
    are extremely satisfied with the performance and reliability of the VAMOX\u2122
    after only a few weeks of operation,\" said Nicolas Duplessis, Director of Development
    for VAMOX\u2122. Guy Drouin, President of Biothermica, added: \"Coal mine ventilation
    air accounts for 50 to 70% of their methane emissions. VAMOX\u2122 can certainly
    help the coal industry minimize its environmental impact. In this sense, we plan
    to develop similar projects in partnership with other American mines. \"\nRecognized
    as an accomplished developer of GHG emission reduction projects, Biothermica always
    aims to produce high-quality carbon credits. The project at JWR is thus validated
    in compliance with the Voluntary Carbon Standard (VCS) and is one of the first
    to be registered on the new APX VCS Registry. [www.vcsregistry.com](http://www.vcsregistry.com)\n\"Jim
    Walter Resources is once again positioning itself as an industry leader with the
    installation of this new technology that enables cleaner coal production,\" said
    Thomas E. McNider, the mine's general manager of engineering. \"The VAMOX\u2122
    is a simple solution because it does not require any modifications to our existing
    equipment and remains independent of our ventilation system.\"\nUsing the proven
    principle of regenerative thermal oxidation (RTO), the VAMOX\u2122 captures and
    oxidizes the methane contained in the ventilation air before this powerful GHG
    is emitted to the atmosphere. With 15 years of experience applied to RTO technology,
    Biothermica has developed VAMOX\u2122 to offer mines a simple and profitable solution
    allowing them to significantly reduce their carbon footprint.\n## About Biothermica\nFounded
    in Montreal in 1987, Biothermica is a leader in the design, construction and turnkey
    delivery of solutions for air pollution control, landfill biogas management and
    the oxidation of methane emitted by coal mines. Biothermica is also a developer
    of GHG emission reduction projects that finances, structures and invests in technically
    relevant projects. Biothermica has carried out projects in North America, Latin
    America, Asia (including China), Africa and Europe. [www.biothermica.com](https://www.biothermica.com)\n##
    About Jim Walter Resources\nJim Walter Resources Inc. (JWR) is the world's largest
    producer of Blue Creek coal. Recognized worldwide by coal producers, the Blue
    Creek deposit is located in the heart of the coal-rich Warrior Basin (USA). JWR
    supplies high-calorific, low-sulfur coal from some of the deepest mines in the
    Americas. Customers on five continents use Blue Creek coal to meet their needs
    with demanding metallurgical and thermal specifications.\n\n## Disclaimer\nThis
    press release contains certain non-historical statements that constitute forward-looking
    statements, including forward-looking statements regarding future events, trends,
    plans or objectives. These statements are based on the current views and assumptions
    of the Company's management and are subject to risks and uncertainties that could
    cause actual results to differ from those expressed or implied by such statements."
