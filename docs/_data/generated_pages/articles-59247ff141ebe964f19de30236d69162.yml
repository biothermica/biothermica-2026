      equity in technically relevant projects. Biothermica has completed projects
      in North and South America, Asia, Africa and Europe. [www.biothermica.com](https://www.biothermica.com).\n##
      About Jim Walter Resources\nJim Walter Resources Inc. (JWR) is the world's largest
      producer of Blue Creek Coal. Known worldwide among coal producers, the Blue
