      the demonstration system oxidized methane for the first time as originally planned
      on January 26, 2009. Capturing 30,000 ft\xB3/min of mine ventilation air, this
      medium-size unit will achieve greenhouse gas (GHG) emission reductions amounting
      to some 40,000 tons of CO2 equivalent each year, the same as removing 8,000
      cars from the road.\n\u201CWe are extremely satisfied with the performance and
      reliability of our system after only a few weeks of operation\u201D said Nicolas
      Duplessis, Director of VAMOX\u2122 Development. Guy Drouin, President of Biothermica,
      added: \u201CMine ventilation air accounts for 50 to 70% of all CMM emissions
      and the VAMOX\u2122 can certainly play a significant role in helping the coal
      mining industry minimize its environmental impact. Building on the success of
      our venture in Alabama, we plan to develop similar projects in close partnership
      with other U.S. mines.\u201D\nWell established as a successful carbon project
      developer, Biothermica always seeks to generate high quality carbon credits.
      For this reason, the project is fully validated in accordance with the Voluntary
      Carbon Standard (VCS) and is one of the first to be listed on the new APX VCS
      Registry. More information regarding this initiative can be found at www.vcsregistry.com\n\u201COnce
      again, Jim Walter Resources leads the industry by implementing a new technology
