_original:
  title: "Le premier syst\xE8me d'att\xE9nuation des \xE9missions de m\xE9thane dans
    les mines de charbon d'Am\xE9rique est d\xE9sormais pleinement op\xE9rationnel"
  title_en: First-of-Kind Coal Mine Methane Mitigation System in America Now Fully
    Operational
  mydate: "2009-04-13"
  body: "Montr\xE9al (Canada), le 13 avril 2009 \u2013 Biothermica a annonc\xE9 aujourd'hui
    que son syst\xE8me novateur de r\xE9duction du m\xE9thane de mine de charbon VAMOX\u2122
    est pleinement op\xE9rationnel \xE0 la mine n\xB0 4 de Jim Walter Resources \xE0
    Brookwood, en Alabama. Pour la premi\xE8re fois aux \xC9tats-Unis, le m\xE9thane
    pr\xE9sent dans l'air de ventilation est d\xE9truit dans une mine de charbon en
    activit\xE9, tout en g\xE9n\xE9rant des cr\xE9dits carbone.\nApprouv\xE9 par la
    Mine Safety & Health Administration (MSHA) du D\xE9partement du Travail des \xC9tats-Unis,
    le syst\xE8me de d\xE9monstration a oxyd\xE9 le m\xE9thane pour la premi\xE8re
    fois, comme pr\xE9vu initialement, le 26 janvier 2009. Captant 30\_000 pi\xB3/min
    d'air de ventilation, cette unit\xE9 de taille moyenne permettra de r\xE9duire
    les \xE9missions de gaz \xE0 effet de serre (GES) d'environ 40\_000 tonnes d'\xE9quivalent
    CO\u2082 par an, soit l'\xE9quivalent de 8\_000 voitures retir\xE9es de la circulation.\n\xAB
    Nous sommes extr\xEAmement satisfaits des performances et de la fiabilit\xE9 de
    notre syst\xE8me apr\xE8s seulement quelques semaines d'exploitation \xBB, a d\xE9clar\xE9
    Nicolas Duplessis, directeur du d\xE9veloppement VAMOX\u2122. Guy Drouin, pr\xE9sident
    de Biothermica, a ajout\xE9 : \xAB L'air de ventilation des mines repr\xE9sente
    50 \xE0 70 % des \xE9missions totales de l'industrie charbonni\xE8re et le VAMOX\u2122
    peut assur\xE9ment jouer un r\xF4le important pour aider cette industrie \xE0
    minimiser son impact environnemental. Forts du succ\xE8s de notre projet en Alabama,
    nous pr\xE9voyons de d\xE9velopper des projets similaires en \xE9troite collaboration
    avec d'autres mines am\xE9ricaines. \xBB\nReconnue pour son expertise dans le
    d\xE9veloppement de projets carbone performants, Biothermica s'attache \xE0 g\xE9n\xE9rer
    des cr\xE9dits carbone de haute qualit\xE9. C'est pourquoi ce projet est enti\xE8rement
    valid\xE9 selon la norme Voluntary Carbon Standard (VCS) et figure parmi les premiers
    \xE0 \xEAtre inscrits au nouveau registre VCS de l'APX. Plus d'informations concernant
    cette initiative sont disponibles sur www.vcsregistry.com\n\xAB Une fois de plus,
    Jim Walter Resources fait figure de pionnier dans le secteur en mettant en \u0153uvre
    une nouvelle technologie de capture et d'utilisation du m\xE9thane pour une production
    de charbon plus propre \xBB, a d\xE9clar\xE9 Thomas E. McNider, directeur g\xE9n\xE9ral
    de l'ing\xE9nierie mini\xE8re. \xAB Le VAMOX\u2122 est une solution simple puisqu'il
    ne n\xE9cessite aucune modification des \xE9quipements miniers existants et reste
    ind\xE9pendant de notre syst\xE8me de ventilation. \xBB\nS'appuyant sur le principe
    \xE9prouv\xE9 de l'oxydation thermique r\xE9g\xE9n\xE9rative (OTR), le VAMOX\u2122
    capture et att\xE9nue les \xE9missions de m\xE9thane de mer (VAM) avant que ce
    puissant gaz \xE0 effet de serre ne soit rejet\xE9 dans l'atmosph\xE8re. Forte
    de ses 15 ann\xE9es d'expertise en OTR, Biothermica a d\xE9velopp\xE9 le VAMOX\u2122
    afin d'offrir aux mines de charbon une solution s\xFBre, simple et rentable pour
    r\xE9duire significativement leur empreinte carbone.\n## \xC0 propos de Biothermica\nFond\xE9e
    en 1987, Biothermica est un chef de file dans la conception, la construction et
    la livraison de solutions cl\xE9s en main pour le contr\xF4le de la pollution
    atmosph\xE9rique, le traitement du biogaz et la valorisation du m\xE9thane des
    mines de charbon. L'entreprise est \xE9galement un d\xE9veloppeur de projets carbone
    enti\xE8rement int\xE9gr\xE9 qui finance, structure et prend des participations
    dans des projets techniquement pertinents. Biothermica a r\xE9alis\xE9 des projets
    en Am\xE9rique du Nord et du Sud, en Asie, en Afrique et en Europe. [www.biothermica.com](https://www.biothermica.com).\n##
    \xC0 propos de Jim Walter Resources\nJim Walter Resources Inc. (JWR) est le plus
    grand producteur mondial de charbon de Blue Creek. Reconnue mondialement parmi
    les producteurs de charbon, la veine de Blue Creek est situ\xE9e au c\u0153ur
    du bassin de Warrior, riche en charbon, en Alabama (\xC9tats-Unis). JWR fournit
    du charbon \xE0 haut pouvoir calorifique et \xE0 faible teneur en soufre provenant
    de certaines des mines les plus profondes du continent nord-am\xE9ricain. Des
    clients sur les cinq continents ont utilis\xE9 le charbon de Blue Creek pour r\xE9pondre
    \xE0 leurs exigences m\xE9tallurgiques et thermiques. [www.jimwalterresources.com](www.jimwalterresources.com).\n##
    \xC0 propos d'APX\nAPX est le principal fournisseur d'infrastructures pour les
    march\xE9s de l'environnement et de l'\xE9nergie dans le secteur des \xE9nergies
    renouvelables et des gaz \xE0 effet de serre, y compris les mati\xE8res premi\xE8res
    carbon\xE9es. L'entreprise est la solution de choix pour tous les grands march\xE9s
    des \xE9nergies renouvelables en Am\xE9rique du Nord et les march\xE9s des gaz
    \xE0 effet de serre dans le monde, notamment le Gold Standard, le Voluntary Carbon
    Standard (VCS) et le programme Climate Action Reserve. [www.apx.com](https://www.apx.com).\n##
    Avertissement\nLors de l'examen de ces informations, veuillez noter qu'elles ont
    \xE9t\xE9 publi\xE9es \xE0 la date indiqu\xE9e, refl\xE8tent l'opinion de la direction
    \xE0 cette date, doivent \xEAtre consid\xE9r\xE9es dans le contexte des circonstances
    en vigueur \xE0 ce moment-l\xE0 et ne sont exactes qu'\xE0 cette date. Ces informations
    peuvent contenir des \xE9nonc\xE9s prospectifs qui sont soumis \xE0 des risques
    et incertitudes connus et inconnus susceptibles d'entra\xEEner des r\xE9sultats
    r\xE9els sensiblement diff\xE9rents de ceux exprim\xE9s ou sous-entendus par ces
    \xE9nonc\xE9s."
  body_en: "Montreal, Canada, April 13, 2009 \u2013 Biothermica today announced that
    its pioneering VAMOX\u2122 coal mine methane (CMM) abatement system is fully operational
    at Jim Walter Resources\u2019 mine no. 4 in Brookwood, Alabama. For the first
    time in America, ventilation air methane (VAM) is being destroyed at an active
    coal mine, all the while generating bankable carbon credits.\nApproved by the
    U.S. Department of Labor\u2019s Mine Safety & Health Administration (MSHA), the
    demonstration system oxidized methane for the first time as originally planned
    on January 26, 2009. Capturing 30,000 ft\xB3/min of mine ventilation air, this
    medium-size unit will achieve greenhouse gas (GHG) emission reductions amounting
    to some 40,000 tons of CO2 equivalent each year, the same as removing 8,000 cars
    from the road.\n\u201CWe are extremely satisfied with the performance and reliability
    of our system after only a few weeks of operation\u201D said Nicolas Duplessis,
    Director of VAMOX\u2122 Development. Guy Drouin, President of Biothermica, added:
    \u201CMine ventilation air accounts for 50 to 70% of all CMM emissions and the
    VAMOX\u2122 can certainly play a significant role in helping the coal mining industry
    minimize its environmental impact. Building on the success of our venture in Alabama,
    we plan to develop similar projects in close partnership with other U.S. mines.\u201D\nWell
    established as a successful carbon project developer, Biothermica always seeks
    to generate high quality carbon credits. For this reason, the project is fully
    validated in accordance with the Voluntary Carbon Standard (VCS) and is one of
    the first to be listed on the new APX VCS Registry. More information regarding
    this initiative can be found at www.vcsregistry.com\n\u201COnce again, Jim Walter
    Resources leads the industry by implementing a new technology that captures and
    utilizes methane to achieve a cleaner coal production\u201D said Thomas E. McNider,
    General Manager of Mining Engineering. \u201CThe VAMOX\u2122 is a simple solution
    since it requires no modification to existing mine equipments and remains independent
    from our ventilation system.\u201D\nUsing the proven principle of regenerative
    thermal oxidation (RTO), the VAMOX\u2122 captures and mitigates VAM emissions
    before this potent GHG is released to the atmosphere. Strong of its  15 year expertise
    with RTO, Biothermica developed the VAMOX\u2122 to offer coal mines a safe, simple
    and profitable solution to significantly decrease their carbon footprint.\n##
    About Biothermica\nFounded in 1987, Biothermica is a leader in the design, construction
    and turn-key delivery of air pollution control, landfill gas and coal mine methane
    solutions. The company is also a fully integrated carbon project developer that
    finances, structures and takes equity in technically relevant projects. Biothermica
    has completed projects in North and South America, Asia, Africa and Europe. [www.biothermica.com](https://www.biothermica.com).\n##
    About Jim Walter Resources\nJim Walter Resources Inc. (JWR) is the world's largest
    producer of Blue Creek Coal. Known worldwide among coal producers, the Blue Creek
    Seam is located in the heart of Alabama's coal-rich Warrior Basin (U.S.). JWR
    provides coal with high BTU and low sulfur content from some of the deepest mines
    on the North American continent. Customers on five continents have utilized Blue
    Creek Coal to meet their demanding metallurgical and thermal specifications. [www.jimwalterresources.com](www.jimwalterresources.com).\n##
    About APX\nAPX is the leading infrastructure provider for environmental and energy
    markets in renewable energy and greenhouse gases including carbon commodities.
    The company is the solution of choice for every major renewable energy market
    in North America and greenhouse gas markets worldwide, including the Gold Standard,
    the Voluntary Carbon Standard (VCS), and the Climate Action Reserve program. [www.apx.com](https://www.apx.com).\n##
    Disclaimer\nWhen reviewing this information consider that it was reported as of
