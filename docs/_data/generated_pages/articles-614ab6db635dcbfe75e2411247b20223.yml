_original:
  title: "Biothermica nomme Nicolas Duplessis en tant que Vice-pr\xE9sident, Air et
    M\xE9thane Minier"
  title_en: Biothermica appoints Nicolas Duplessis as Vice President, Air & Coal Mine
    Methane
  mydate: "2011-07-27"
  body: "## Montr\xE9al, Canada, le 27 Juillet 2011 ## \u2013 M. Guy Drouin, Pr\xE9sident
    et chef de la direction de Biothermica, a aujourd\u2019hui annonc\xE9 la nomination
    de Nicolas Duplessis, Ing\xE9nieur, en tant que Vice-pr\xE9sident, Air et m\xE9thane
    minier.\nDans ses nouvelles fonctions, M. Duplessis sera responsable de la gestion
    et de la croissance li\xE9e aux technologies propri\xE9taires de Biothermica pour
    le contr\xF4le de la pollution atmosph\xE9rique en milieu industriel (BIOTOX\xAE,
    CLINOX\xAE, etc.) et la destruction des \xE9missions de m\xE9thane, un gaz \xE0
    effet de serre (GES) puissant, issues de l\u2019air de ventilation des mines de
    charbon (appel\xE9 en anglais \"ventilation air methane\" ou VAM) (VAMOX\xAE).\nLe
    VAMOX\xAE est au c\u0153ur de la strat\xE9gie de d\xE9veloppement de Biothermica
    qui, face au nouveau march\xE9 du VAM, se positionne en tant qu\u2019investisseur
    et d\xE9veloppeur de projets g\xE9n\xE9rant des revenus r\xE9currents \xE0 travers
    la vente de cr\xE9dits de carbone.\nM. Duplessis a rejoint Biothermica en 2006
    en tant que Directeur du D\xE9veloppement, Technologies et march\xE9s. Avant de
    joindre Biothermica, il a accumul\xE9 un savoir-faire et des connaissances cruciales
    gr\xE2ce \xE0 une exp\xE9rience de plus de 6 ans dans l\u2019industrie a\xE9rospatiale.
    Son travail l\u2019a amen\xE9 \xE0 vivre 4 ans \xE0 l\u2019\xE9tranger (\xC9tats-Unis
    et France) tout en coordonnant diff\xE9rentes activit\xE9s, clients et membres
    d\u2019\xE9quipe \xE0 travers plusieurs continents.\nDans son r\xF4le pass\xE9
    de Directeur du d\xE9veloppement, M. Duplessis a \xE9t\xE9 instrumental dans le
    succ\xE8s de multiples projets et activit\xE9s cl\xE9s. Par-dessus tout, il a
    \xE9t\xE9 la force motrice derri\xE8re le positionnement de Biothermica en tant
    que leader mondial pour la r\xE9duction des \xE9missions de VAM.\nCette nomination
    marque \xE9galement une r\xE9organisation strat\xE9gique de l\u2019\xE9quipe de
    direction de Biothermica, centr\xE9e sur la croissance et l\u2019optimisation
    des ressources afin d\u2019atteindre de nouveaux sommets de performance.\n\"Je
    suis extr\xEAmement content de l\u2019opportunit\xE9 d\u2019assumer ce nouveau
    r\xF4le et d\u2019avoir la chance de contribuer de mani\xE8re plus d\xE9terminante
    au d\xE9veloppement de Biothermica,\" a dit M. Duplessis. \"Le VAMOX\xAE et le
    BIOTOX\xAE sont des solutions remarquables et la mani\xE8re unique dont Biothermica
    aborde le march\xE9 repr\xE9sente un avantage tangible pour nos partenaires et
    clients.\"\n## Au sujet de Biothermica\nFond\xE9e en 1987, Biothermica est un
    chef de file dans le d\xE9veloppement, le financement, la construction et l\u2019op\xE9ration
    de projets de destruction de m\xE9thane \xE9mis par les sites d\u2019enfouissement
    et les mines de charbon souterraines. En tant que d\xE9veloppeur int\xE9gr\xE9,
    l\u2019entreprise commercialise \xE9galement les cr\xE9dits de carbone et l\u2019\xE9lectricit\xE9
    g\xE9n\xE9r\xE9s par ses projets sur les march\xE9s domestiques internationaux.
    Biothermica a r\xE9alis\xE9 des projets de g\xE9n\xE9ration de cr\xE9dits de carbone
    et d\u2019\xE9lectricit\xE9 en Am\xE9rique du Nord et en Am\xE9rique centrale.
    L\u2019entreprise fournit \xE9galement des solutions cl\xE9-en-main pour le contr\xF4le
    des \xE9missions industrielles. [www.biothermica.com](http://www.biothermica.com)"
  body_en: "## Montreal, Canada, July 27, 2011 ## \u2013 Mr. Guy Drouin, President
    and CEO of Biothermica, today announced the appointment of Nicolas Duplessis,
    Engineer, as Vice President, Air & Coal Mine Methane (CMM).\nIn his new role,
    Mr. Duplessis will be responsible for managing all activities and driving growth
    related to Biothermica\u2019s proprietary technologies for controlling industrial
    air pollution emissions (BIOTOX\xAE, CLINOX\xAE, etc.) and mitigating methane
    emissions, a powerful greenhouse gas (GHG), from coal mine ventilation exhaust
    air (referred to as ventilation air methane or VAM) (VAMOX\xAE).\nThe VAMOX\xAE
    is the cornerstone of Biothermica\u2019s strategy for tapping into the CMM abatement
    market as an investor and developer of projects that generate recurring revenues
    from the sale of carbon offset credits.\nMr. Duplessis joined Biothermica in 2006
    as Director of Development, Technologies & Markets. Before joining Biothermica,
    he had accumulated crucial knowledge and insights during his more than 6 years
    in the aerospace industry. Of those, he has lived almost 4 years abroad in the
    U.S.A. and France while coordinating activities, clients and team members across
    several continents.\nIn his past role of Director of Development, Mr. Duplessis
    has proven to be instrumental in the success of multiple projects and key activities.
    Above all, he has been the driving force behind the positioning of Biothermica
    as a world leader for abating VAM emissions.\nThis appointment also marks a strategic
    reorganization of Biothermica\u2019s management aimed at stimulating growth and
    optimizing the use of resources to achieve new heights of success.\n\u201CI am
    extremely pleased about the opportunity to take this new role and have the chance
    to contribute more profoundly to Biothermica\u2019s development,\u201D said Mr.
    Duplessis. \u201CThe VAMOX\xAE and BIOTOX\xAE are outstanding solutions and Biothermica\u2019s
    unique approach to the marketplace represents a tangible advantage for our partners
    and clients.\u201D\n## About Biothermica Founded in 1987, Biothermica is a leader
    in the development, financing, building and operation of projects which capture
    and destroy methane emitted by landfill sites and underground coal mines. As a
    fully integrated project developer, the company also monetizes the carbon offset
    credits generated by its projects on the international markets. Biothermica has
    completed carbon projects in North and Central America. Biothermica also provides
    turn-key solutions for the control of industrial air pollution emissions. For
    more information about Biothermica, please visit the company web site at [www.biothermica.com](http://www.biothermica.com)"
