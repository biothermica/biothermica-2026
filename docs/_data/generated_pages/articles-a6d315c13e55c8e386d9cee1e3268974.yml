  mydate: "2012-09-24"
  body: "La 2013 Methane Expo a eu lieu du 12 au 15 mars 2013 \xE0 Vancouver, au Canada.
    L'\xE9v\xE9nement fut organis\xE9 par le gouvernement du Canada en collaboration
    avec la US Environmental Protection Agency (EPA). Les conf\xE9rences pr\xE9sent\xE9es
    dans le cadre de cet \xE9v\xE9nement sont accessibles [ici](http://www.globalmethane.org/expo_canada13/proceedings.html)
    (Pr\xE9sentation de Biothermica disponible ci-bas).\nM. Raphael Bruneau, Directeur-March\xE9
