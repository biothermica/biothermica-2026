  title: Nouvelle Video - Centrale au biogaz Gazmont
  title_en: New Video - Gazmont Landfill Gas Power Plant
  mydate: "2013-08-13"
  body: "Ecotech Quebec, l'association qu\xE9b\xE9coise des technologies propres,
    a produit une nouvelle vid\xE9o d\xE9di\xE9e \xE0 la centrale de cog\xE9n\xE9ration
    au biogaz de Biothermica. En op\xE9ration depuis 1996 sur le site d'enfouissement
    de la Ville de Montr\xE9al, la centrale Gazmont, d'une capacit\xE9 de 25 MW, a
    r\xE9alis\xE9 des r\xE9ductions de gaz \xE0 effet de serre de plus de 10 millions
    de tonnes de CO2 \xE9quivalent (tCO2e) et produit plus de 2 milliards de kWh en
    \xE9lectricit\xE9 verte.\nLa centrale alimente actuellement en \xE9lectricit\xE9
