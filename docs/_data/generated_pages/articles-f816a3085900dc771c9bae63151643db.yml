  title: "Pr\xE8s de 1 M$ pour un projet de Biothermica \xE0 Ha\xEFti"
  title_en: Nearly $ 1 million for a Biothermica project in Haiti
  mydate: "2017-08-29"
  body: "## Programme de coop\xE9ration climatique internationale : pr\xE8s de 1 M$
    pour un projet de Biothermica Technologies \xE0 Ha\xEFti\nChef de file dans le
    domaine de la valorisation des biogaz et du m\xE9thane minier, Biothermica Technologies
    Inc., une entreprise de Montr\xE9al, recevra une aide financi\xE8re gouvernementale
    de 999 617 $, issue du Fonds vert, pour un projet de valorisation \xE9nerg\xE9tique
    des biogaz dans la municipalit\xE9 des Gona\xEFves, \xE0 Ha\xEFt.  Le projet consiste
    notamment en la premi\xE8re phase de l'implantation d'un syst\xE8me int\xE9gr\xE9
    de gestion et de valorisation des d\xE9chets.  Ce projet cr\xE9era des emplois
    pour les Gona\xEFviennes et les Gona\xEFviens, g\xE9n\xE9rera des retomb\xE9es
    \xE9conomiques dans la r\xE9gion en plus de contribuer \xE0 la production d'\xE9nergie
    propre, \xE0 la lutte contre les changements climatiques et \xE0 l'av\xE8nement
    d'une \xE9conomie plus sobre en carbone.\nLe ministre des Affaires municipales
    et de l'Occupation du territoire, ministre de la S\xE9curit\xE9 publique et ministre
    responsable de la r\xE9gion de Montr\xE9al, M. Martin Coiteux, a fait cette annonce
    au nom du ministrte du D\xE9veloppement durable, de l'Environnement et de la lutte
    contre les changements climatiques, M. David Heurtel.  Mentionnons que le projet
    de Biothermica fait partie des 14 projets internationaux s\xE9lectionn\xE9s \xE0
    l'issue de l'appel \xE0 projets qui s'est termin\xE9 le 31 janvier 2017 et pour
    lequel une enveloppe globale de pr\xE8s de 10 millions de dollars a \xE9t\xE9
    accord\xE9e.\nLa r\xE9alisation du projet constituera un point tournant dans la
    gestion des d\xE9chets de la municipalit\xE9 des Gona\xEFves gr\xE2ce \xE0 l'installation
    d'un syst\xE8me de collecte des d\xE9chets \xE0 domicile, aux \xE9tudes de faisabilit\xE9
    concernant l'utilisation d'une technologie innovatrice de r\xE9cup\xE9ration des
    biogaz, \xE0 la g\xE9n\xE9ration d'\xE9nergie et \xE0 la d\xE9livrance de cr\xE9dits
    carbone dans le cadre du m\xE9canisme de d\xE9veloppement propre du protocole
    de Kyoto.\nLe projet est ax\xE9 sur la valorisation de solutions adapt\xE9es aux
    besoins locaux, sur l'adaptation et le d\xE9ploiement de cette technologie propre
    \xE9prouv\xE9e et sur l'\xE9mergence d'un \xE9cosyst\xE8me d'affaires dynamique
    gr\xE2ce \xE0 l'\xE9tablissement d'un solide r\xE9seau de partenaires locaux.
    \ Dans le but d'assurer une r\xE9elle prise en charge locale de la lutte contre
    les changements climatiques, Biothermica Technologies s'est adjoint un organisme
    \xE0 but non lucratif local, Bio\xE9nergie Ha\xEFti, qui sera responsable de la
    gestion des installations en plus d'en assurer la propri\xE9t\xE9.  Le projet
    implique \xE9galement une participation active de plusieurs groupes locaux ha\xEFtiens
    et de la population.\n## Citations :\n\xABLe Qu\xE9bec r\xE9pond \xE0 l'appel
    des Nations Unies en faveur de la hausse du financement international des actions
    climatiques dans les pays en d\xE9veloppement.  La lutte contre les changements
    climatiques demande un engagement r\xE9el de la part des \xC9tats f\xE9d\xE9r\xE9s
    qui poss\xE8dent l'expertise et la capacit\xE9 de soutenir les pays les moins
    favoris\xE9s.  Ce transfert de connaissances permet non seulement de lutter contre
    les changements climatiques, mais de stimuler l'\xE9conomie.  C'est pourquoi nous
    sommes fiers de soutenir le projet de Biothermica Technologies qui met sa cr\xE9ativit\xE9
    et son expertise au service d'un monde plus sobre en carbone et plus r\xE9silient
    aux changements climatiques.\xBB\n_David Heurtel, ministre du D\xE9veloppement
    durable, de l'Environnement et de la lutte contre les changements climatiques_\n\xABJe
    me r\xE9jouis du financement accord\xE9 \xE0 Biothermica Technologies, une entreprise
    montr\xE9alaise innovante, dans le cadre du Programme de coop\xE9ration climatique
    internationale.  En appuyant le travail d'entreprises comme celle-ci, notre m\xE9tropole
    et le Qu\xE9bec font valoir leur expertise dans le domaine et apportent une contribution
    concr\xE8te et positive aux efforts d'adaptation aux changements climatiques dans
    les pays les plus vuln\xE9rables.\xBB\n_Martin Coiteux, ministre des Affaires
    municipales et de l'Occupation du territoire, ministre de la S\xE9curit\xE9 publique
    et ministre responsable de la r\xE9gion de Montr\xE9al_\n\xABDepuis notre premi\xE8re
    mission aux Gona\xEFves en 2010, nous avons \xE9tabli de solides liens avec la
    municipalit\xE9 des Gona\xEFves, le gouvernement central, la population locale
    et Bio\xE9nergie Ha\xEFti pour que ce premier projet de gestion int\xE9gr\xE9e
    des d\xE9chets soit un mod\xE8le de transfert technologique Nord-Sud et qu'il
    contribue \xE0 l'atteinte des objectifs de r\xE9duction des GES pr\xE9vus dans
    l'accord de Paris.  Nous saluons l'engagement du gouvernement du Qu\xE9bec, qui
    nous appuie dans la lutte contre les changements climatiques non seulement sur
    le territoire qu\xE9b\xE9cois, mais dans les pays les plus vuln\xE9rables, qui
    ont un ardent besoin de technologies propres adapt\xE9es \xE0 leur contexte local
    et contribuant \xE0 leur ind\xE9pendance \xE9nerg\xE9tique.\xBB\n_Guy Drouin,
    pr\xE9sident de Biothermica Technologies Inc._\n### Faits saillants :\n\n  -  Dot\xE9
    d'une enveloppe de 18 millions de dollars sur cinq ans, le Programme de coop\xE9ration
    climatique internationale appuie les projets d'organisations qu\xE9b\xE9coises
    du secteur priv\xE9, des milieux de la solidarit\xE9 internationale et de la recherche
    visant la r\xE9duction des \xE9missions de gaz \xE0 effet de serre (GES) et l'adaptation
    aux impacts des changements climatiques dans les pays francophones les plus vuln\xE9rables
    \xE0 ces impacts.\n\n  -  L'aide financi\xE8re accord\xE9e au projet est issue
    du Fonds vert et s'inscrit dans le cadre de la mise en oeuvre du Plan d'action
    2013-2020 sur les changements climatiques, dont l'une des mesures vise \xE0 faire
    rayonner le Qu\xE9bec sur la sc\xE8ne internationale.\n\n  -  Fond\xE9e en 1987,
    Biothermica Technologies est un chef de file dans le d\xE9veloppement, le financement,
    la construction et l'op\xE9ration de projets de destruction de m\xE9thane \xE9mis
    par les sites d'enfouissement et les mines de charbon souterraines.  En tant que
    d\xE9veloppeur int\xE9gr\xE9, l'entreprise commercialise \xE9galement les cr\xE9dits
    carbone et l'\xE9nergie g\xE9n\xE9r\xE9s par ses projets sur les march\xE9s nationaux
    et internationaux."
  body_en: "### International Climate Cooperation Program: Nearly $ 1M for a Biothermica
    Technologies project in Haiti\nBiothermica Technologies Inc., a Montr\xE9al company,
    is a leader in biogas and underground mine methane, will receive $ 999,617 in
    government funding through the Green Fund for a biogas valorization project in
    the municipality of Gonaives, in Haiti.  The project includes the first phase
    of the implementation of an integrated waste management and recevery system.  This
    project will create jobs for men and women of Govaives, generate economic repercussions
    in the region, contribute to clean energy production, combat climate change and
    a more sober carbon economy.\nMartin Coiteux, Minister of Municipal Affairs and
    Land Occupancy, Minister of Public Security, Minister responsible for the Montr\xE9al
    region, made the announcement on behalf of David Heurtel, Minister of Sustainable
    Development, the Environment and the Fight Against Climate Change.  Biothermica
    Technologies' project is one of the 14 international projects selected after the
    call for projects which ended on January 31, 2017 and for which a global allocation
    of nearly 10 million dollars was awarded.\nThe implementation of the project will
    be a turning point in waste management in the municipality of Gonaives through
    the installation of a home waste collection system, feasibility studies on the
    use of innovative biogas recevery technology, energy generation and the issuance
    of carbon credits under the Clean Development Mechanism of the Kyoto Protocol.\nThe
    project focuses on the development of solutions adapted to local needs, the adaptation
    and deployment of this proven clean technology and the emergence of a dynamic
    business ecosystem through the establishment of a strong network of partners.
    \ Biothermica has joined a local non-profit organization, Bio\xE9nergie Haiti,
    which will be responsible for the management of the installation in addition to
    ensure ownership.  The project involves the active participation of several Haitian
    local groups and the population.\n#### Quotes :\n\"Quebec is responding to the
    United Nations' call for increased international funding for climate actions in
    developing countries.  The fight against climate change requires a real commitment
    on the part of the federated states which possess the expertise and the capacity
    to support the least favored countries.  This knowledge transfer not only helps
    fight climate change, but stimulates the economy.  That is why we are proud to
    support Biothermica Technologies' project, which puts its creativiy and expertise
    at the service of a world that is more carbon-neutral and more resilient to climate
    change.\"\n_David Heurtel, Minister of Sustainable Development, the Environment
    and the Fight Against Climate Change_\n\"i am pleased with the funding provided
    to Biothermica Technologies, an innovative Montr\xE9al company, under the International
    Climate Cooperation Program.  By supporting the work of companies such as this
    one, our metropolis and the Quebec bring their expertise to the field and make
    a concrete and positive contribution to climate change adaptation efforts in the
    most vulnerable countries.\n_Martin Coiteux, Minister of Municipal Affairs and
    Land Occupancy, Minister of Public Security, Minister responsible for the Montr\xE9al
    region_\n\"Since our first mission to Gonaives in 2010, we have established strong
    links with the Municipality of Gonaives, the central government, the local population
    and Bio\xE9nergie Haiti so that this first integrated  waste management project
    is a model of North-South cooperation and contributes to the achievement of the
    GHG reduction targets foreseen in the Paris Agreement.  We welcome the Government
    of Quebec's commitment to fight climate change not only in Quebec but in the most
    vulnerable countries, which have a strong need for clean technologies adapted
    to their local context and contributing to their energy independance.\"\n_Guy
    Drouin, president of Biothermica Technologies Inc._\n## Highlights:\n\n  -  The
    International Climate Cooperation Program, with an envelop of $ 18 million over
    five years, supports projects by quebec private sector organizations, international
    solidarity communities and research aimed at reducing (GHG) and adaptation to
    the impacts of climate change in the most vulnerable francophone countries.\n\n
    \ -  Funding for the project comes from the Green Fund and is part of the implementation
    of the 2013-2020 Action Plan on Climate Change, one of which is to promote Qu\xE9bec
    on the international scene.\n\n\n  - Founded in 1987, Biothermica Technologies
    is a leader in the development, financing, construction and operation of methane
    destruction projects from landfills and underground coal mines.  As an integrated
    developer, the company also markets carbon credits and energy generated by its
    projects in domestic and international markets."
