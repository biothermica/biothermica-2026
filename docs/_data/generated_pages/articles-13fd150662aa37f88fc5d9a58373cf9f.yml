  title: "Biothermica acquiert le contr\xF4le de Gazmont"
  title_en: Biothermica acquires control of Gazmont
  mydate: "2011-07-13"
  body: "## Montr\xE9al, Canada, le 13 juillet 2011 ## \u2013 Biothermica a aujourd\u2019hui
    annonc\xE9 la restructuration financi\xE8re de la soci\xE9t\xE9 en commandite
    Gazmont, par laquelle l\u2019entreprise a acquis la totalit\xE9 des int\xE9r\xEAts
    d\xE9tenus par le groupe SNC-Lavalin et la Caisse de d\xE9p\xF4t et placement
    du Qu\xE9bec. Cette restructuration marque une \xE9tape importante dans le d\xE9veloppement
    de la centrale de cog\xE9n\xE9ration au biogaz Gazmont, situ\xE9e au c\u0153ur
    du complexe environnemental Saint-Michel, \xE0 Montr\xE9al.\nDor\xE9navant seul
    propri\xE9taire de la centrale, Biothermica envisage la mise en \u0153uvre d\u2019un
    nouveau plan de d\xE9veloppement, ax\xE9 sur l\u2019extension du projet de chauffage
    urbain par lequel Gazmont fournit actuellement de l\u2019eau chaude \xE0 l\u2019immeuble
    voisin de la Cit\xE9 des arts du cirque (TOHU). La valorisation du vaste potentiel
    d\u2019\xE9nergie thermique de la centrale permettra ainsi d\u2019\xE9tendre graduellement
    le r\xE9seau de chauffage urbain aux \xE9tablissements institutionnels, commerciaux
    et industriels situ\xE9s \xE0 proximit\xE9.\n\xAB Ce projet vert et innovant est
    \xE0 l\u2019image des r\xE9seaux de chauffage urbain d\xE9velopp\xE9s dans les
    villes de Copenhague, Toronto ou encore Vancouver \xBB, a expliqu\xE9 Guy Drouin,
    Pr\xE9sident de Biothermica. \xAB S\u2019appuyant \xE9galement sur le march\xE9
    du carbone naissant au Qu\xE9bec, notre projet fournira de l\u2019\xE9nergie verte
    \xE0 la communaut\xE9 environnante et diminuera les gaz \xE0 effet de serre gr\xE2ce
    au d\xE9placement de combustibles fossiles \xBB.\n\xC0 terme, l\u2019extension
    du r\xE9seau de chauffage urbain devrait engendrer des r\xE9ductions de gaz \xE0
    effet de serre de l\u2019ordre de 80 000 tonnes de CO2 \xE9quivalent par an (tCO2e/an),
    soit l\u2019\xE9quivalent de retirer 15 000 voitures de nos routes.\nDepuis 1996,
    la centrale Gazmont, d\u2019une capacit\xE9 de 25 MW, d\xE9truit le biogaz \xE9mis
    par l\u2019ancien site d\u2019enfouissement de la Ville de Montr\xE9al. Gr\xE2ce
    \xE0 la combustion du biogaz dans sa chaudi\xE8re, la centrale a engendr\xE9 des
    r\xE9ductions de gaz \xE0 effet de serre cumulatives de l\u2019ordre de 10 millions
    tCO2e. La centrale Gazmont joue un r\xF4le de premier plan en mati\xE8re de vitrine
    technologique du savoir-faire qu\xE9b\xE9cois dans le domaine des technologies
    propres et de la r\xE9duction des gaz \xE0 effet de serre.\n## Au sujet de Biothermica\nFond\xE9e
    en 1987, Biothermica est un chef de file dans le d\xE9veloppement, le financement,
    la construction et l\u2019op\xE9ration de projets de destruction de m\xE9thane
    \xE9mis par les sites d\u2019enfouissement et les mines de charbon souterraines.
    En tant que d\xE9veloppeur int\xE9gr\xE9, l\u2019entreprise commercialise \xE9galement
    les cr\xE9dits de carbone et l\u2019\xE9lectricit\xE9 g\xE9n\xE9r\xE9s par ses
    projets sur les march\xE9s domestiques internationaux. Biothermica a r\xE9alis\xE9
    des projets de g\xE9n\xE9ration de cr\xE9dits de carbone et d\u2019\xE9lectricit\xE9
    en Am\xE9rique du Nord et en Am\xE9rique centrale. [www.biothermica.com](http://www.biothermica.com)\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 peut contenir certaines donn\xE9es
    non historiques constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel,
    et notamment des d\xE9clarations prospectives concernant des \xE9v\xE8nements,
    tendances, plans ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur
    les vues et hypoth\xE8ses actuelles de la Direction de l\u2019entreprise et sont
    sujettes \xE0 des risques et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence
    entre les r\xE9sultats r\xE9els et ceux contenus explicitement ou implicitement
    dans ces d\xE9clarations."
  body_en: "## Montreal, Canada, July 13, 2011 ## \u2013 Biothermica today announced
    the completion of the financial restructuring of the Gazmont Limited Partnership,
    according to which Biothermica has acquired all interests held by SNC-Lavalin
    and the Caisse de d\xE9p\xF4t et placement du Qu\xE9bec. This restructuring marks
    an important milestone in the development of the Gazmont cogeneration power plant,
    located at the heart of the Saint-Michel environmental complex, in Montreal.\n\nUnder
    Biothermica\u2019s sole ownership, a new development plan is envisioned, focused
    on extending the district heating project which currently supplies hot water to
    the adjacent Cit\xE9 des arts du cirque (TOHU) building. The valorization of the
    power plant\u2019s significant thermal energy potential will enable the gradual
    extension of the district heating network to the institutional, commercial and
    industrial buildings located nearby.\n\n\xAB This innovative and green project
    mirrors similar district heating networks developed in cities such as Copenhagen,
    Toronto or Vancouver \xBB, explained Guy Drouin, President of Biothermica. \xAB
    Taking advantage of the emerging carbon market in Quebec, our project will supply
    green energy to the surrounding community and will reduce greenhouse gas emissions
    thanks to the displacement of fossil fuels \xBB.\n\nIn the medium to long term,
    the district heating project should reduce greenhouse gas emissions by some 80,000
    tons of CO2 equivalent per year (tCO2e/y), the same as removing approximately
    15,000 cars from the road.\n\nCommissioned in 1996, the 25 MW capacity Gazmont
    power plant destroys the landfill gas emitted by the city of Montreal\u2019s closed
    landfill, one of the largest sanitary landfill sites in North America. Thanks
    to the combustion of this potent greenhouse gas in its boiler, the power plant
    has reduced greenhouse gas emissions by some 10 million tCO2e since its inception.
    The Gazmont power plant constitutes a technological show-case of Quebec\u2019s
    know-how in the fields of clean technology and the reduction of greenhouse gas
    emissions.\n\n## About Biothermica\n\nFounded in 1987, Biothermica is a leader
    in the development, financing, building and operation of projects which capture
    and destroy methane emitted by landfill sites and underground coal mines. As a
    fully integrated project developer, the company also monetizes the energy and
    carbon offset credits generated by its projects on the national and international
    markets. Biothermica has completed energy and carbon projects in North and Central
    America. For more information about Biothermica, please visit the company web
    site at [www.biothermica.com](http://www.biothermica.com)\n\n## Disclaimer\n\nWhen
    reviewing this information consider that it was reported as of the date listed,
    reflected management views as of that date, should be considered in the context
    of the circumstances prevailing at that time and is only correct as of that date.
    The information can contain forward looking statements that are subject to known
    and unknown risks and uncertainties that could cause actual results to differ
    materially from those expressed or implied by such statements.\n"
