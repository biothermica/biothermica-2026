    en: "## Montreal, Canada, October 22, 2009 ## \u2013 Biothermica today announced
      that it has been inducted into the National Quality Institute\u2019s Canadian
      Hall of Excellence. The Canada Awards for Excellence program rewards leading
      organizations from the private and public sectors with Canada's pre-eminent
      distinction for Organizational Excellence.\nBiothermica initially received the
      Canada Award for Excellence for its innovative BIOTOX\xAE technology which destroys
      non conventional and corrosive emissions from numerous industries. This award
      recognized the BIOTOX\xAE as a major breakthrough in the field of air pollution
      control.\n\u201CBiothermica is greatly honoured by this induction,\u201D said
      Guy Drouin, President of Biothermica. \u201CSince the company\u2019s inception
      in 1987, we have strived to maintain a standard of excellence throughout all
      our operations. Our accomplishments have positioned Biothermica as a key player
      in the fight against air pollution and climate change\u201D.\nBased on its experience
      with the BIOTOX\xAE technology, Biothermica recently developed the VAMOX\xAE
      system for the oxidation of underground coal mine ventilation air methane (VAM).
      The company financed and implemented the first VAM abatement project at an active
      mine in America. This project, located at Jim Walter Resources\u2019 mine no.
      4 in Alabama (USA), first oxidized methane in January 2009.\n## About Biothermica\nFounded
      in 1987, Biothermica is a leader in the design, construction and turn-key delivery
      of air pollution control and landfill gas-to-energy solutions. Biothermica is
      also a fully integrated developer of methane destruction and utilization projects
      based on the monetization of carbon credits. [www.biothermica.com](https://www.biothermica.com)\n##
      Disclaimer\nWhen reviewing this information consider that it was reported as
