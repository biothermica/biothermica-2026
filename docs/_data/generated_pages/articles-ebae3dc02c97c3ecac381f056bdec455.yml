  title: Biothermica rejoint le Temple canadien de l'excellence
  title_en: Biothermica Inducted into Canadian Hall of Excellence
  mydate: "2009-10-22"
  body: "## Montr\xE9al, Canada, le 22 octobre 2009 ## \u2013 Biothermica a aujourd\u2019hui
    annonc\xE9 son intronisation au sein du Temple canadien de l\u2019excellence de
    l\u2019Institut national de qualit\xE9. Les Prix canadiens d\u2019excellence visent
    \xE0 r\xE9compenser des organisations en provenance des secteurs public ou priv\xE9,
    et chef de file dans leur domaine.\nBiothermica a initialement re\xE7u le Prix
    canadien d\u2019excellence pour sa technologie innovatrice BIOTOX\xAE, appliqu\xE9e
    \xE0 la destruction des \xE9missions non conventionnelles et corrosives de nombreuses
    industries. Cette distinction constitue une reconnaissance du BIOTOX\xAE en tant
    que perc\xE9e majeure dans le domaine du contr\xF4le de la pollution de l\u2019air.\n\xAB
    Nous sommes honor\xE9s par cette intronisation\xBB a indiqu\xE9 Guy Drouin, Pr\xE9sident
    de Biothermica. \xAB Depuis sa fondation en 1987, Biothermica s\u2019est efforc\xE9e
    de maintenir un standard d\u2019excellence \xE0 travers toutes ses op\xE9rations.
    Nos r\xE9alisations ont positionn\xE9 la compagnie en tant qu\u2019acteur incontournable
    de la lutte contre la pollution de l\u2019air et les changements climatiques \xBB.\nS\u2019appuyant
    sur son exp\xE9rience avec la technologie BIOTOX\xAE, Biothermica a \xE9galement
    d\xE9velopp\xE9 le syst\xE8me VAMOX\xAE pour l\u2019oxydation du m\xE9thane contenu
    dans l\u2019air de ventilation des mines de charbon souterraines, commun\xE9ment
    appel\xE9 \"ventilation air methane \" (VAM). L\u2019entreprise a r\xE9cemment
    financ\xE9 et implant\xE9 le premier projet VAM sur une mine de charbon active
    en Am\xE9rique. Ce projet, situ\xE9 sur la mine no. 4 de l\u2019entreprise Jim
    Walter Resources, en Alabama (\xC9tats-Unis), a oxyd\xE9 du m\xE9thane pour la
    premi\xE8re fois au mois de janvier 2009.\n## Au sujet de Biothermica\nFond\xE9e
    \xE0 Montr\xE9al en 1987, Biothermica est une entreprise chef de file dans la
    conception, la construction et la livraison cl\xE9s en main de solutions pour
    le contr\xF4le de la pollution atmosph\xE9rique et la gestion des biogaz issu
    de sites d\u2019enfouissement. Biothermica est \xE9galement un d\xE9veloppeur
    int\xE9gr\xE9 de projets de destruction et de valorisation du m\xE9thane bas\xE9s
    sur la mon\xE9tisation de cr\xE9dits de carbone. [www.biothermica.com](https://www.biothermica.com)\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 peut contenir certaines donn\xE9es
    non historiques constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel,
    et notamment des d\xE9clarations prospectives concernant des \xE9v\xE8nements,
    tendances, plans ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur
    les vues et hypoth\xE8ses actuelles de la Direction de l\u2019entreprise et sont
    sujettes \xE0 des risques et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence
    entre les r\xE9sultats r\xE9els et ceux contenus explicitement ou implicitement
    dans ces d\xE9clarations."
  body_en: "## Montreal, Canada, October 22, 2009 ## \u2013 Biothermica today announced
    that it has been inducted into the National Quality Institute\u2019s Canadian
    Hall of Excellence. The Canada Awards for Excellence program rewards leading organizations
    from the private and public sectors with Canada's pre-eminent distinction for
    Organizational Excellence.\nBiothermica initially received the Canada Award for
    Excellence for its innovative BIOTOX\xAE technology which destroys non conventional
    and corrosive emissions from numerous industries. This award recognized the BIOTOX\xAE
    as a major breakthrough in the field of air pollution control.\n\u201CBiothermica
    is greatly honoured by this induction,\u201D said Guy Drouin, President of Biothermica.
    \u201CSince the company\u2019s inception in 1987, we have strived to maintain
    a standard of excellence throughout all our operations. Our accomplishments have
    positioned Biothermica as a key player in the fight against air pollution and
    climate change\u201D.\nBased on its experience with the BIOTOX\xAE technology,
    Biothermica recently developed the VAMOX\xAE system for the oxidation of underground
    coal mine ventilation air methane (VAM). The company financed and implemented
    the first VAM abatement project at an active mine in America. This project, located
    at Jim Walter Resources\u2019 mine no. 4 in Alabama (USA), first oxidized methane
    in January 2009.\n## About Biothermica\nFounded in 1987, Biothermica is a leader
    in the design, construction and turn-key delivery of air pollution control and
    landfill gas-to-energy solutions. Biothermica is also a fully integrated developer
    of methane destruction and utilization projects based on the monetization of carbon
    credits. [www.biothermica.com](https://www.biothermica.com)\n## Disclaimer\nWhen
    reviewing this information consider that it was reported as of the date listed,
    reflected management views as of that date, should be considered in the context
    of the circumstances prevailing at that time and is only correct as of that date.
    The information can contain forward looking statements that are subject to known
    and unknown risks and uncertainties that could cause actual results to differ
    materially from those expressed or implied by such statements."
