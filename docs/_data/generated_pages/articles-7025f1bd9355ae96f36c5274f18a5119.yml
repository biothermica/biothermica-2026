_original:
  title: "Biothermica conclut un premier \xE9change de cr\xE9dits avec le gouvernement
    du Luxembourg"
  title_en: Biothermica completes its first carbon credits transaction with the government
    of Luxemburg
  mydate: "2007-02-06"
  body: "## Montr\xE9al, 6 f\xE9vrier 2007 ## \u2013 La firme de courtage Evolution
    Markets Inc annonce aujourd'hui qu\u2019elle a conclu un premier \xE9change de
    cr\xE9dits de carbone entre le Gouvernement du Luxembourg et Biothermica \xC9nergie
    Inc, en vertu du M\xE9canisme de D\xE9veloppement Propre (MDP) du Protocole Kyoto.
    La vente de r\xE9ductions d'\xE9missions certifi\xE9es d\xE9coule d\u2019un important
    projet de valorisation \xE9nerg\xE9tique des biogaz d\u2019un site d\u2019enfouissement
    sanitaire au Salvador financ\xE9 par Biothermica, une firme montr\xE9alaise, et
    marque la premi\xE8re transaction de sa division \xC9nergie. Rappelons que le
    m\xE9thane contenu dans le biogaz est un GES r\xE9gi par le Protocole de Kyoto
    qui est 21 fois plus nocif que le CO2.\nGr\xE2ce au savoir-faire d\xE9velopp\xE9
    par Biothermica depuis plus de vingt ans dans la r\xE9cup\xE9ration des biogaz
    des sites d\u2019enfouissement et de r\xE9duction des gaz \xE0 effets de serre
    (GES) dans le cadre notamment du projet Gazmont, l\u2019entreprise canadienne
    r\xE9alise un des premiers projets du genre dans le cadre du M\xE9canisme de D\xE9veloppement
    Propre du protocole de Kyoto. \xAB Le march\xE9 du carbone est actuellement en
    pleine effervescence \xBB, selon monsieur Guy Drouin, pr\xE9sident de Biothermica.
    \xAB Et, bien que le gouvernement canadien n\u2019ait pas instaur\xE9 de syst\xE8me
    d\u2019\xE9change de cr\xE9dits de carbone \xE0 ce jour, nous n\u2019h\xE9sitons
    pas \xE0 investir dans de tels projets \xE0 l\u2019\xE9tranger compte-tenu des
    multiples opportunit\xE9s qui existent pr\xE9sentement pour contrer les \xE9missions
    de GES responsables des changements climatiques \xBB.\nPar le biais de cette entente,
    Biothermica consent \xE0 vendre 325,000 tonnes de r\xE9duction de GES au Gouvernement
    du Luxembourg, soit tout autant de cr\xE9dits. Ces cr\xE9dits seront g\xE9n\xE9r\xE9s
    par son projet de valorisation \xE9nerg\xE9tique des biogaz du site d\u2019enfouissement
    sanitaire de Nejapa, situ\xE9 dans le nord du Salvador. Rencontrant les exigences
    r\xE9gissant le M\xE9canisme de D\xE9veloppement Propre du Protocole Kyoto, les
    cr\xE9dits de carbone vendus au Gouvernement de Luxembourg seront g\xE9n\xE9r\xE9s
    entre 2006 et 2012.\n\xAB L\u2019\xE9change intervenu entre Biothermica et le
    Gouvernement luxembourgeois est l\u2019exemple parfait de ce pourquoi le M\xE9canisme
    de D\xE9veloppement Propre \xE0 \xE9t\xE9 con\xE7u\xBB explique M. Andrew Ertel,
    Pr\xE9sident Directeur g\xE9n\xE9ral d\u2019Evolution Markets Inc. \xAB La mise
    en place d\u2019un march\xE9 du carbone et la vente de cr\xE9dits compensatoires
    ont rendu possible ce projet salvadorien. D\u2019autre part, le Luxembourg peut
    ainsi r\xE9duire ses \xE9missions de gaz \xE0 effet de serre\xBB.\nLe lieu d\u2019enfouissement
    sanitaire de Nejapa re\xE7oit les mati\xE8res r\xE9siduelles municipales du Salvador
    m\xE9tropolitain. Ce projet, qui se r\xE9alisera en deux phases, propose initialement
    de r\xE9cup\xE9rer et de br\xFBler le m\xE9thane puis, dans un second temps, de
    compl\xE9ter la construction d\u2019un syst\xE8me de valorisation \xE9nerg\xE9tique
    des biogaz permettant de produire initialement 6 MW d\u2019\xE9lectricit\xE9,
    favorisant ainsi de nouvelles r\xE9ductions d'\xE9missions de GES. De plus, le
    projet Nejapa de Biothermica constitue le premier du genre \xE0 avoir re\xE7u,
    en juillet 2006, une garantie de l'Agence multilat\xE9rale de garantie des investissements
    (MIGA) de la Banque mondiale. Cette garantie couvre certains risques non commerciaux
    pouvant affecter l'ex\xE9cution du projet enregistr\xE9 aupr\xE8s du Conseil Ex\xE9cutif
    du MDP.\n\xAB Nous sommes fiers d\u2019avoir conclu cette premi\xE8re transaction
    \xBB, affirme M. Drouin. Gr\xE2ce \xE0 la technologie \xE9prouv\xE9e de r\xE9duction
    des gaz \xE0 effet de serre mise au point et l\u2019obtention de la garantie de
    MIGA, le projet de Nejapa s\u2018av\xE9rait parfaitement adapt\xE9 au march\xE9
    du carbone. Ultimement, cet \xE9change d\xE9montre l'effet de levier que peut
    avoir le march\xE9 de carbone en permettant \xE0 l\u2019Am\xE9rique Latine de
    tirer profit de technologies de pointe en valorisation \xE9nerg\xE9tique d\xE9velopp\xE9e
    au Canada et ultimement engendrer un b\xE9n\xE9fice environnemental global.\nLe
    M\xE9canisme de D\xE9veloppement Propre est un des trois m\xE9canismes souples
    du Protocole de Kyoto con\xE7us pour encourager l'investissement dans des projets
    de r\xE9duction d'\xE9missions de gaz \xE0 effet de serre dans les pays en voie
    de d\xE9veloppement. Les pays industrialis\xE9s qui se sont engag\xE9s \xE0 r\xE9duire
    leurs \xE9missions conform\xE9ment au Protocole de Kyoto, peuvent ainsi utiliser
    des cr\xE9dits tir\xE9s de projets MDP afin de rencontrer leurs obligations. Le
    Luxembourg en tant que membre de l\u2019Union europ\xE9enne, a sign\xE9 et ratifi\xE9
    le Protocole de Kyoto et s\u2019est engag\xE9es \xE0 r\xE9duire ses \xE9missions
    de gaz \xE0 effet de serre de 8% en dessous du niveau de 1990 d\u2019ici 2012.
    Dans ce contexte, le Luxembourg s\u2019est engag\xE9 \xE0 r\xE9duire ses \xE9missions
    de 28%.\n## AU SUJET DE BIOTHERMICA Fond\xE9e en 1987, Biotermica est une soci\xE9t\xE9
    de technologie sp\xE9cialis\xE9e dans le d\xE9veloppement, la conception et la
    construction de projets cl\xE9-en-mains reli\xE9s au traitement des gaz et des
    mati\xE8res r\xE9siduelles. Elle poss\xE8de quatre divisions: la division Contr\xF4le
    de la Pollution de l'air, la division Biogaz, la division \xC9nergie et la division
    Commerce du Carbone.\nSa division Energie se sp\xE9cialise essentiellement dans
    la valorisation des biogaz, de la biomasse et de toutes les formes d'\xE9nergies
    renouvelables disponibles localement (vent, soleil, g\xE9othermie) et dans l'int\xE9gration
    optimale de ces ressources. Elle est en mesure de mener toutes les \xE9tapes n\xE9cessaires
    \xE0 la r\xE9alisation d'un projet de production d'\xE9nergie, des \xE9tudes de
    faisabilit\xE9 jusqu'\xE0 sa conception, sa construction et son financement. La
    division Energie d\xE9veloppe \xE9galement dans ses laboratoires des technologies
    de valorisation \xE9nerg\xE9tique de biomasse et des d\xE9chets solides (gaz\xE9ification
    et pyrolyse). Elle innove \xE9galement au niveau de l\u2019int\xE9gration des
    diff\xE9rentes formes d\u2019\xE9nergies renouvelables.\n## AU SUJET D\u2019EVOLUTION
    MARKETS Evolution Markets Inc constitue le plus important courtier de produits
    environnementaux \xE0 l\u2019\xE9chelle mondiale. Fond\xE9e en l\u2019an 2000,
    la maison de courtage facilite les transactions de gr\xE9 \xE0 gr\xE9 sur le march\xE9
    du carbone, des \xE9missions am\xE9ricaines, de l'\xE9nergie renouvelable, des
    d\xE9riv\xE9es m\xE9t\xE9orologiques, du charbon, du gaz naturel, du combustible
    nucl\xE9aire et des march\xE9s de biocarburants. Evolution Markets fait figure
    de pionniers dans le secteur de l'\xE9nergie et des march\xE9s environnementaux,
    ayant simplifi\xE9 les premiers \xE9changes commerciaux dans le cadre du M\xE9canisme
    de D\xE9veloppement Propre du Protocole de Kyoto."
  body_en: "Montreal, February 6, 2007: Evolution Markets Inc. announces today it
    has brokered a trade of carbon reduction credits under the Kyoto Protocol\u2019s
    Clean Development Mechanism (CDM) between the Government of Luxembourg and Biothermica
    Energy Inc. The sale of certified emissions reductions (CERs) from its landfill
    gas-to-energy project in El Salvador marks the first trade by Biothermica Energy,
    a Montreal based project developer.\nUnder this transaction, Biothermica Energy
    agrees to sell 325,000 CERs to the Government of Luxembourg. Biothermica Energy
    is selling carbon credits created from its landfill gas-to-energy project at the
    Nejapa Landfill Site in El Salvador. The Nejapa project qualifies under the Kyoto
    Protocol\u2019s Clean Development Mechanism, and credits sold to the Government
    of Luxembourg will be generated between 2006 and 2012.\nThanks to the know-how
    developed by Biothermica Energy over 20 years in landfill gas recovery and in
    the reduction of greenhouse gas (GHG) emissions, the company realizes one of the
    first Canadian projects in this particular field in accordance with the Clean
    Development Mechanism. \"The carbon market is presently in full swing,\u201D according
    to Mr. Guy Drouin, president of Biothermica. \u201CAnd although the Canadian government
    has not yet endorsed carbon trading, we do not hesitate to invest in such projects
    abroad considering the considerable market-based opportunities that exist to counter
    the GHG emission responsible for climate change.\u201D\n\u201CBiothermica\u2019s
    trade with the Government of Luxembourg is a perfect example of how the Clean
    Development Mechanism is designed to work,\u201D said Andrew Ertel, President
    & CEO of Evolution Markets Inc. \u201CCarbon financing from the sale of CERs makes
    this El Salvadoran landfill gas-to-energy project possible. On the other side,
    Luxembourg is able to reduce its overall greenhouse gas emissions.\u201D\nThe
    Nejapa landfill receives municipal solid waste from the San Salvador metropolitan
    area. This two-phase project will initially collect and flare methane gas. At
    a later stage, the project will complete a 6MW landfill gas-to-electricity system,
    creating further greenhouse gas emissions reductions. In addition, Biothermica
    Energy\u2019s Nejapa project was the first to receive a guarantee from the Multilateral
    Guarantee Agency (MIGA) of the World Bank in July 2006. The MIGA guarantee covers
    certain sovereign and non-commercial risks, which might affect the performance
    of the project. The Nejapa project is registered with the CDM Executive Board
    (No. 0167).\n\u201CWe are very pleased to have completed this first trade,\u201D
    said Mr. Drouin. \u201CWith its sound and verifiable method for reducing greenhouse
    gases and the World Bank\u2019s MIGA guarantee, the Nejapa project was well structured
    for the market. Ultimately, this trade demonstrates the ability to leverage carbon
    markets to bring the latest landfill gas-to-energy technology to Latin America,
    ultimately benefiting the global environment.\u201D\nThe Clean Development Mechanism
    is a market tool created under the Kyoto Protocol to encourage investment in greenhouse
    gas emissions reduction projects in the developing world. Developed countries
    that have committed to reduce greenhouse gas emissions under the Protocol may
    use credits derived from CDM projects to meet their obligations. Luxembourg has
    signed and ratified the Kyoto Protocol and is part of the European Union\u2019s
    group of nations that have committed to cumulatively reduce greenhouse gas emissions
    8% below 1990 emissions by the year 2012. In this context, Luxembourg has committed
    itself to a 28% reduction target.\n## About Evolution Markets Inc. Evolution Markets
    Inc. is the largest global broker of environmental products. Formed in 2000, the
    company structures transactions in the global carbon, U.S. emissions, renewable
    energy, weather derivative, and over the counter (OTC) coal, natural gas, nuclear
    fuel, and biofuels markets. Evolution Markets personnel are pioneers in energy
    and environmental markets having facilitated the first trades in Kyoto carbon
    credits, European emissions allowances, SO2 allowances, NOx allowances, ERCs in
    several states, weather derivatives, and OTC natural gas and coal trades. Based
    in White Plains, NY, Evolution Markets serves clients on five continents from
    offices in New York, San Francisco, London, Calgary, Bratislava, and Prague. (www.evomarkets.com)[www.evomarkets.com]\n##
    About Biothermica Energy Inc. Founded in 1987, Biotermica is a technology corporation
    specialized in the development design engineering and construction of turn-key
    projects related to thermal treatment of gas and waste. It has three divisions:
    the Air Pollution Control Division, the Landfill Gas Management Division and the
    Energy Division. The mission of the Energy Division essentially lies in the landfill
    gas management, biomass and all available renewable forms of energy and in the
    optimal integration of these resources. The Division is capable of leading all
    the necessary stages of realization of energy production projects, from feasibility
    studies to their conception and completion. The Division also use its laboratories
    to develops technologies utilizing biomass and solid waste (gasification and pyrolysis).
    It also innovates at the level of integration of the various forms of renewable
    energies. (www.biothermica.com)[www.biothermica.com]"
