      quatre divisions: la division Contr\xF4le de la Pollution de l'air, la division
      Biogaz, la division \xC9nergie et la division Commerce du Carbone.\nSa division
      Energie se sp\xE9cialise essentiellement dans la valorisation des biogaz, de
      la biomasse et de toutes les formes d'\xE9nergies renouvelables disponibles
      localement (vent, soleil, g\xE9othermie) et dans l'int\xE9gration optimale de
      ces ressources. Elle est en mesure de mener toutes les \xE9tapes n\xE9cessaires
      \xE0 la r\xE9alisation d'un projet de production d'\xE9nergie, des \xE9tudes
      de faisabilit\xE9 jusqu'\xE0 sa conception, sa construction et son financement.
      La division Energie d\xE9veloppe \xE9galement dans ses laboratoires des technologies
      de valorisation \xE9nerg\xE9tique de biomasse et des d\xE9chets solides (gaz\xE9ification
      et pyrolyse). Elle innove \xE9galement au niveau de l\u2019int\xE9gration des
      diff\xE9rentes formes d\u2019\xE9nergies renouvelables.\n## AU SUJET D\u2019EVOLUTION
      MARKETS Evolution Markets Inc constitue le plus important courtier de produits
      environnementaux \xE0 l\u2019\xE9chelle mondiale. Fond\xE9e en l\u2019an 2000,
      la maison de courtage facilite les transactions de gr\xE9 \xE0 gr\xE9 sur le
      march\xE9 du carbone, des \xE9missions am\xE9ricaines, de l'\xE9nergie renouvelable,
      des d\xE9riv\xE9es m\xE9t\xE9orologiques, du charbon, du gaz naturel, du combustible
      nucl\xE9aire et des march\xE9s de biocarburants. Evolution Markets fait figure
      de pionniers dans le secteur de l'\xE9nergie et des march\xE9s environnementaux,
      ayant simplifi\xE9 les premiers \xE9changes commerciaux dans le cadre du M\xE9canisme
      de D\xE9veloppement Propre du Protocole de Kyoto."
