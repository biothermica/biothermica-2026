  title: "Biothermica enregistre les premiers cr\xE9dits g\xE9n\xE9r\xE9s par son
    projet de m\xE9thane minier aux \xC9tats-Unis"
  title_en: Biothermica Registers First Coal Mine Methane Credits with the Climate
    Action Reserve
  mydate: "2010-06-15"
  body: "## Montr\xE9al, Canada, le 15 juin 2010 ## \u2013 Biothermica a aujourd\u2019hui
    annonc\xE9 l\u2019enregistrement avec le standard \xAB Climate Action Reserve
    \xBB des premiers cr\xE9dits g\xE9n\xE9r\xE9s par son projet pionnier de destruction
    du m\xE9thane \xE9mis par un syst\xE8me de ventilation d\u2019une mine de charbon
    souterraine (\xAB Ventilation Air Methane \xBB ou VAM). Implant\xE9 sur la mine
    No. 4 de la compagnie Jim Walter Resources en Alabama (\xC9tats-Unis), ce projet
    est le premier de sa cat\xE9gorie \xE0 \xEAtre enregistr\xE9 avec ce standard
    reconnu.\nUtilisant la technologie VAMOX\xAE de Biothermica, ce projet de d\xE9monstration
    a g\xE9n\xE9r\xE9 25,931 cr\xE9dits (\xAB Climate Reserve Tons \xBB ou CRTs) durant
    sa premi\xE8re ann\xE9e d\u2019op\xE9ration, entre les mois de Mars 2009 et Mars
    2010. La production de cr\xE9dits pour les ann\xE9es subs\xE9quentes devrait quant
    \xE0 elle atteindre pr\xE8s de 35,000 CRTs par an.\n\xAB L\u2019enregistrement
    de ces premiers cr\xE9dits g\xE9n\xE9r\xE9s en Am\xE9rique du Nord par un projet
    VAM d\xE9montre la viabilit\xE9 de notre offre innovante en mati\xE8re de destruction
    de m\xE9thane minier \xBB a indiqu\xE9 Guy Drouin, Pr\xE9sident de Biothermica.
    \xAB Notre \xE9quipe int\xE9gr\xE9e prend charge de tous les aspects d\u2019un
    projet VAM, incluant l\u2019\xE9tude de faisabilit\xE9, la technologie, et la
    mon\xE9tisation des cr\xE9dits de carbone. Cette approche conf\xE8re \xE0 Biothermica
    un avantage unique par rapport aux autres acteurs de cette industrie \xBB.\nBiothermica
    est fi\xE8re d\u2019avoir enregistr\xE9 ces cr\xE9dits avec l\u2019un des programmes
    les plus rigoureux aux \xC9tats-Unis. \xAB La rigueur et la qualit\xE9 des protocoles
    du Climate Action Reserve assurent le respect des principes de conservatisme et
    d\u2019exactitude quant \xE0 l\u2019estimation des r\xE9ductions d\u2019\xE9missions
    r\xE9alis\xE9es par les projets enregistr\xE9s sous notre standard \xBB a expliqu\xE9
    Gary Gero, Pr\xE9sident du Climate Action Reserve. \xAB Nous f\xE9licitons Biothermica
    pour son leadership en mati\xE8re de lutte contre les changements climatiques
    et son statut de pionnier au sein de l\u2019industrie mini\xE8re \xBB.\nS\u2019appuyant
    sur cette r\xE9ussite, Biothermica pr\xE9voit d\xE9velopper des projets similaires
    en partenariat avec d\u2019autres mines afin de cr\xE9er de la valeur \xE0 partir
    de leur VAM. Biothermica se positionne en tant que partenaire technique et financier,
    permettant ainsi aux mines de se concentrer sur leur activit\xE9 principale.\n##
    Au sujet de Biothermica\nFond\xE9e \xE0 Montr\xE9al en 1987, Biothermica est un
    chef de file dans la conception, la construction et la livraison cl\xE9s en main
    de solutions pour le contr\xF4le de la pollution atmosph\xE9rique, la gestion
    des biogaz issu de sites d\u2019enfouissement et l\u2019oxydation du m\xE9thane
    \xE9mis par les mines de charbon. Biothermica est \xE9galement un d\xE9veloppeur
    de projets de r\xE9duction des \xE9missions de gaz \xE0 effet de serre, qui finance,
    structure et investit dans des projets techniquement pertinents. Biothermica a
    r\xE9alis\xE9 des projets en Am\xE9rique du nord, en Am\xE9rique Latine, en Asie
    (incluant la Chine), en Afrique et en Europe. [www.biothermica.com](https://www.biothermica.com)\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 contient certaines donn\xE9es non historiques
    constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel, et notamment
    des d\xE9clarations prospectives concernant des \xE9v\xE8nements, tendances, plans
    ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur les vues et hypoth\xE8ses
    actuelles de la Direction de l\u2019entreprise et sont sujettes \xE0 des risques
    et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence entre les r\xE9sultats
    r\xE9els et ceux contenus explicitement ou implicitement dans ces d\xE9clarations."
  body_en: "## Montreal, Canada, June 15, 2010 ## \u2013 Biothermica today announced
    the registration with the Climate Action Reserve of the first carbon credits from
    its pioneering ventilation air methane (VAM) project at Jim Walter Resources\u2019
    No. 4 Mine in Alabama (USA). This is the first coal mine methane activity to be
    registered with this recognized offsets program.\nFeaturing Biothermica\u2019s
    VAMOX\xAE system, the demonstration project has generated 25,931 Climate Reserve
    Tonnes (CRTs) during its first year of operation, covering March 2009 to March
    2010. Following this initial ramp-up period, production is expected to reach approximately
    35,000 carbon offset credits each year.\n\u201CThe registration of these first
    credits from a VAM oxidation project in America is the last step in proving the
    viability of our innovative coal mine methane abatement solution,\u201D said Guy
    Drouin, President of Biothermica. \u201CUnlike any other industry player, Biothermica\u2019s
    integrated team delivers on all aspects of VAM projects, from the feasibility
    study to the technology and the monetization of the carbon credits.\u201D\nBiothermica
    is proud to have registered these credits under one of the most stringent programs
    in the United States. \u201CThe rigorous and regulatory-quality protocols of the
    Climate Action Reserve ensure that greenhouse gas emissions reductions are accounted
    for in a conservative, accurate and comprehensive methodology,\u201D stated Gary
    Gero, President of the Climate Action Reserve. \u201CWe applaud Biothermica\u2019s
    leadership for taking voluntary early-action to address climate change and for
    being a pioneer in the coal mine industry.\u201D\nBuilding on this achievement,
    Biothermica plans to develop similar ventures with other mines and create value
    from their VAM. Biothermica seeks to get involved as a risk sharing partner and
    sponsor of VAM oxidation projects, thereby allowing mines to focus on their primary
    activity.\n## About Biothermica\nFounded in 1987, Biothermica is a leader in the
    development, financing, building and operation of projects which capture and destroy
    methane emitted by landfill sites and underground coal mines. As a fully integrated
    project developer, the company also monetizes the carbon offset credits generated
    by its projects on the international markets. Biothermica has completed carbon
    projects in North and Central America. [www.biothermica.com](index.html)\n## Disclaimer\nWhen
    reviewing this information consider that it was reported as of the date listed,
    reflecting management views as of that date. It should also be considered in the
    context of the circumstances prevailing at that time and is only correct as of
    that date. The information can contain forward looking statements that are subject
    to known and unknown risks and uncertainties that could cause actual results to
    differ materially from those expressed or implied by such statements."
