  title: "Premier projet Kyoto de r\xE9duction des \xE9missions de GES assur\xE9 par
    la Multilateral Investment Guarantee Agency de la Banque Mondiale \xE0 Nejapa,
    El Salvador"
  title_en: First Kyoto GHG emission reduction project to be insured by the Multilateral
    Investment Guarantee Agency of the World Bank in Nejapa, El Salvador
  mydate: "2006-06-06"
  body: "MIGA a r\xE9cemment annonc\xE9 son soutien initial \xE0 un projet qui vendra
    les cr\xE9dits carbone obtenus gr\xE2ce \xE0 la r\xE9duction des \xE9missions
    de gaz \xE0 effet de serre. Ces r\xE9ductions, qui peuvent \xEAtre vendues dans
    le cadre du Protocole de Kyoto, r\xE9sulteront de la conversion des gaz m\xE9thane
    en dioxyde de carbone moins nocifs dans une d\xE9charge au Salvador.\nMIGA soutient
    le projet en fournissant une garantie (assurance) de 2 millions de dollars \xE0
    la soci\xE9t\xE9 canadienne Biothermica Energy Inc. La garantie assure \xE0 l'investisseur
    un remboursement dans le cas o\xF9 un \xE9v\xE9nement politique nuisible \u2014
    y compris l'expropriation, la guerre et les troubles civils (y compris le terrorisme)
    et la violation de contrat \u2014 mettrait fin aux op\xE9rations. La couverture
    de MIGA garantit \xE9galement la certification (ou lettre d'approbation) du gouvernement
    salvadorien pour la r\xE9duction du carbone, d\xE9livr\xE9e dans le cadre du M\xE9canisme
    de d\xE9veloppement propre du Protocole de Kyoto."
  body_en: |-
    MIGA recently announced its first-time support for a project that will sell carbon credits gained by reducing greenhouse gas emissions. The reductions, which can be sold under the Kyoto Protocol, will result from the conversion of methane gases to less harmful carbon dioxide at a landfill in El Salvador.

    MIGA is supporting the project by providing $2 million in guarantee coverage (insurance) to Canadian company Biothermica Energy Inc. The guarantee assures the investor of reimbursement in the event that a harmful political event-including expropriation, war and civil disturbance (including terrorism), and breach of contract-puts a stop to operations. MIGA's coverage also guarantees the Salvadoran government's certification (or letter of approval) of the carbon reduction, issued under the Clean Development Mechanism of the Kyoto Protocol.
