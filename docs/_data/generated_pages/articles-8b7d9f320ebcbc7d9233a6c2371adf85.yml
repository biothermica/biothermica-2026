  title: "Biothermica inscrit le premier projet de m\xE9thane de la mine de charbon
    avec la Climate Action Reserve"
  title_en: Biothermica Lists First Coal Mine Methane Project with the Climate Action
    Reserve
  mydate: "2010-02-02"
  body: "## Montr\xE9al, Canada, 2 f\xE9vrier 2010 ## \u2013 Biothermica a annonc\xE9
    aujourd'hui l'inscription aupr\xE8s de la Climate Action Reserve de son projet
    pionnier de m\xE9thane d'air de ventilation (VAM) \xE0 la mine n\xB04 de Jim Walter
    Resources en Alabama (\xC9tats-Unis). Il s'agit de la premi\xE8re activit\xE9
    m\xE9thanique dans une mine de charbon \xE0 \xEAtre inscrite dans ce programme
    de compensation reconnu.\nDot\xE9 du syst\xE8me VAMOX\xAE de Biothermica, le projet
    de d\xE9monstration est conforme \xE0 la version 1.0 du protocole du projet de
    m\xE9thane de mines de la Climate Action Reserve. En tant que membre du groupe
    de travail sur le m\xE9thane des mines de charbon de la r\xE9serve, Biothermica
    a activement particip\xE9 au processus de d\xE9veloppement du protocole.\n\"Cette
    nouvelle \xE9tape nous rapproche de la mon\xE9tisation des premiers cr\xE9dits
    de compensation carbone r\xE9sultant de la r\xE9duction de la VAM en Am\xE9rique
    \", a d\xE9clar\xE9 Nicolas Duplessis, directeur du d\xE9veloppement de Biothermica.
    \" Nous cherchons toujours \xE0 maximiser la valeur de nos projets carbone et,
    en regardant vers l'avenir, nous voyons un fort potentiel dans le protocole rigoureux
    de la Climate Action Reserve. \"\nApr\xE8s un an d'exploitation, Biothermica pr\xE9voit
    de g\xE9n\xE9rer environ 27 000 cr\xE9dits de compensation carbone qui seront
    enregistr\xE9s aupr\xE8s de la Climate Action Reserve et vendus sur le march\xE9
    nord-am\xE9ricain. Apr\xE8s cette p\xE9riode initiale d'acc\xE9l\xE9ration, la
    production devrait atteindre environ 35 000 cr\xE9dits de compensation carbone
    chaque ann\xE9e.\nLe succ\xE8s du projet est \xE9galement le r\xE9sultat d'une
    \xE9troite collaboration avec l'\xE9quipe de direction et technique de Jim Walter
    Resources, partenaire de Biothermica. \xAB Jim Walter Resources a trouv\xE9 un
    excellent partenaire pour la biothermie. Nous appr\xE9cions leur approche exp\xE9riment\xE9e
    et r\xE9aliste des projets carbone \xBB, a d\xE9clar\xE9 Rich Donnelly, vice-pr\xE9sident
    de l'ing\xE9nierie. \" S'impliquer tr\xE8s t\xF4t dans l'oxydation VAM t\xE9moigne
    aussi de notre engagement \xE0 r\xE9duire l'impact environnemental de nos op\xE9rations.
    \"\nS'appuyant sur cette r\xE9ussite, Biothermica pr\xE9voit de d\xE9velopper
    des initiatives similaires avec d'autres mines et de cr\xE9er de la valeur \xE0
    partir de leur VAM. Biothermica cherche \xE0 s'impliquer en tant que partenaire
    de partage des risques et sponsor de projets d'oxydation VAM, permettant ainsi
    aux mines de se concentrer sur leur activit\xE9 principale.\n## \xC0 propos de
    la biothermique\nFond\xE9e en 1987, Biothermica est un leader dans le d\xE9veloppement,
    le financement, la construction et l'exploitation de projets qui captent et d\xE9truisent
    le m\xE9thane \xE9mis par les sites de d\xE9charge et les mines souterraines de
    charbon. En tant que d\xE9veloppeur de projets pleinement int\xE9gr\xE9, l'entreprise
    mon\xE9tise \xE9galement les cr\xE9dits de compensation carbone g\xE9n\xE9r\xE9s
    par ses projets sur les march\xE9s internationaux. Biothermica a men\xE9 \xE0
    bien des projets carbone en Am\xE9rique du Nord et centrale. [www.biothermica.com](../index.html)\n##
    \xC0 propos de Jim Walter Resources\nJim Walter Resources Inc. est le plus grand
    producteur mondial de charbon Blue Creek. Connu mondialement parmi les producteurs
    de charbon, la couche Blue Creek est situ\xE9e au c\u0153ur du bassin Warrior
    (\xC9tats-Unis), riche en charbon. JWR fournit du charbon \xE0 haute teneur en
    BTU et \xE0 faible teneur en soufre provenant de certaines des mines les plus
    profondes du continent nord-am\xE9ricain. Des clients sur cinq continents ont
    utilis\xE9 Blue Creek Coal pour r\xE9pondre \xE0 leurs exigences m\xE9tallurgiques
    et thermiques exigeantes. [www.walterenergy.com](http://www.walterenergy.com)\n##
    Avertissement\nLors de l'examen de ces informations, consid\xE9rez qu'elles ont
    \xE9t\xE9 d\xE9clar\xE9es \xE0 la date indiqu\xE9e, en tenant compte des opinions
    de la direction \xE0 cette date. Il doit \xE9galement \xEAtre consid\xE9r\xE9
    dans le contexte des circonstances en vigueur \xE0 ce moment-l\xE0 et n'est correct
    qu'\xE0 cette date. Les informations peuvent contenir des d\xE9clarations prospectives
    soumises \xE0 des risques et incertitudes connus ou inconnus, pouvant faire difier
    mat\xE9riellement des r\xE9sultats r\xE9els de ceux exprim\xE9s ou sous-entendus
    par ces d\xE9clarations."
  body_en: "## Montreal, Canada, February 2, 2010 ## \u2013 Biothermica today announced
    the listing with the Climate Action Reserve of its pioneering ventilation air
    methane (VAM) project at Jim Walter Resources\u2019 No. 4 Mine in Alabama (USA).
    This is the first coal mine methane activity to be listed with this recognized
    offsets program.\nFeaturing Biothermica\u2019s VAMOX\xAE system, the demonstration
    project complies with version 1.0 of the Climate Action Reserve\u2019s Coal Mine
    Methane Project Protocol. As a member of the Reserve\u2019s Coal Mine Methane
    workgroup, Biothermica actively participated in the protocol development process.\n\u201CThis
    new milestone brings us closer to the monetization of the first carbon offset
    credits resulting from VAM abatement in America,\u201D said Nicolas Duplessis,
    Biothermica\u2019s Director of Development. \u201CWe always seek to maximize the
    value of our carbon projects and, looking forward, we see a strong potential in
    the Climate Action Reserve\u2019s rigorous protocol.\u201D\nAfter one year of
    operation, Biothermica expects to generate approximately 27,000 carbon offset
    credits which will be registered with the Climate Action Reserve and sold on the
    North American market. Following this initial ramp-up period, production is expected
    to reach approximately 35,000 carbon offset credits each year.\nThe project\u2019s
    success is also a result of the close cooperation with the management and technical
    team of Jim Walter Resources, Biothermica\u2019s partner. \u201CJim Walter Resources
    has found a great partner in Biothermica. We appreciate their experienced and
    realistic approach to carbon projects,\u201D said Rich Donnelly, Vice President
    of Engineering. \u201CGetting involved with VAM oxidation early on also testifies
    to our dedication to reduce the environmental impact of our operations.\u201D\nBuilding
    on this achievement, Biothermica plans to develop similar ventures with other
    mines and create value from their VAM. Biothermica seeks to get involved as a
    risk sharing partner and sponsor of VAM oxidation projects, thereby allowing mines
    to focus on their primary activity.\n## About Biothermica\nFounded in 1987, Biothermica
    is a leader in the development, financing, building and operation of projects
    which capture and destroy methane emitted by landfill sites and underground coal
    mines. As a fully integrated project developer, the company also monetizes the
    carbon offset credits generated by its projects on the international markets.
    Biothermica has completed carbon projects in North and Central America. [www.biothermica.com](../index.html)\n##
    About Jim Walter Resources\nJim Walter Resources Inc. is the world's largest producer
    of Blue Creek Coal. Known worldwide among coal producers, the Blue Creek Seam
    is located in the heart of Alabama's coal-rich Warrior Basin (U.S.). JWR provides
    coal with high BTU and low sulfur content from some of the deepest mines on the
    North American continent. Customers on five continents have utilized Blue Creek
    Coal to meet their demanding metallurgical and thermal specifications. [www.walterenergy.com](http://www.walterenergy.com)\n##
    Disclaimer\nWhen reviewing this information consider that it was reported as of
    the date listed, reflecting management views as of that date. It should also be
    considered in the context of the circumstances prevailing at that time and is
    only correct as of that date. The information can contain forward-looking statements
    that are subject to known and unknown risks and uncertainties that could cause
    actual results to differ materially from those expressed or implied by such statements."
