  title: "Biothermica, r\xE9cipiendaire du prestigieux prix de la grappe mondiale
    des technologies propres"
  title_en: Biothermica Wins International Clean Technology Award from the Global
    Cleantech Cluster Association
  mydate: "2012-11-13"
  body: "## Montr\xE9al - Savannah, le 13 novembre 2012 ## \u2013 Biothermica, entreprise
    chef de file dans le domaine de la valorisation des biogaz et du m\xE9thane minier,
    est fi\xE8re d\u2019annoncer qu\u2019elle a remport\xE9 un prix international
    dans le secteur des technologies propres. Ce prestigieux prix a \xE9t\xE9 d\xE9cern\xE9
    hier soir \xE0 Savannah, en G\xE9orgie (\xC9-U), par l\u2019Association internationale
    des technologies propres, la Global Cleantech Cluster Association (GCCA), dans
    le cadre de la conf\xE9rence internationale sur les \xE9nergies vertes.\nCe prix,
    le \xAB Clean Technology Later Stage Award \xBB, r\xE9compense les leaders mondiaux
    dans le domaine en forte croissance des technologies propres et des \xE9nergies
    renouvelables.\nLaur\xE9at dans la cat\xE9gorie Bio\xE9nergie, Biothermica est
    r\xE9compens\xE9e gr\xE2ce \xE0 ses activit\xE9s d\u2019\xE9limination et de valorisation
    du m\xE9thane \xE9mis par les sites d\u2019enfouissement et les mines de charbon
    souterraines, aux \xC9tats-Unis, au Salvador, en Chine et au Canada. Pionni\xE8re
    dans ce domaine, l\u2019entreprise est notamment responsable du d\xE9veloppement,
    du financement et de la construction de la plus importante centrale au biogaz
    au Canada. La centrale Gazmont de cog\xE9n\xE9ration au biogaz valorise depuis
    1996 le m\xE9thane \xE9mis par l\u2019ancien site d\u2019enfouissement de la Ville
    de Montr\xE9al.\n\"Nous sommes tr\xE8s honor\xE9s qu\u2019une entreprise qu\xE9b\xE9coise
    re\xE7oive cette reconnaissance internationale pour la qualit\xE9 de ses technologies
    et son importance dans le secteur mondial des technologies propres. Nous d\xE9sirons
    remercier \xC9cotech Qu\xE9bec d\u2019avoir soutenu notre candidature,\" indique
    Guy Drouin, Pr\xE9sident de Biothermica. \"La centrale de cog\xE9n\xE9ration Gazmont,
    unique au Qu\xE9bec, constitue une vitrine technologique internationale du savoir-faire
    qu\xE9b\xE9cois en mati\xE8re de d\xE9veloppement durable et une importante r\xE9f\xE9rence
    pour l\u2019exportation de nos technologies \xE0 travers le monde.\"\nDepuis 1996,
    la combustion du biogaz dans la chaudi\xE8re de la centrale a permis de g\xE9n\xE9rer
    plus de 2 milliards de kWh d\u2019\xE9lectricit\xE9 verte et des r\xE9ductions
    de gaz \xE0 effet de serre cumulatives de l\u2019ordre de 11 millions tonnes de
    CO2 \xE9quivalent (tCO2e), soit une moyenne de 700,000 tCO2e par an ou l\u2019\xE9quivalent
    d\u2019enlever 150,000 voitures de nos routes.\nS\u2019appuyant sur ce succ\xE8s,
    Biothermica envisage plusieurs projets d\u2019expansion de ses activit\xE9s au
    Qu\xE9bec et \xE0 l\u2019international en mati\xE8re de production d\u2019\xE9nergie
    renouvelable.\n\"La valorisation \xE9nerg\xE9tique du biogaz au c\u0153ur de Montr\xE9al
    par la centrale Gazmont et l\u2019ensemble des activit\xE9s de Biothermica au
    Qu\xE9bec illustre bien la contribution des technologies propres \xE0 la prosp\xE9rit\xE9
    durable du Qu\xE9bec\" explique Denis Leclerc, Pr\xE9sident et chef de la direction
    d\u2019\xC9cotech Qu\xE9bec. \"Nous sommes fiers de ce fleuron qu\xE9b\xE9cois
    car il est un mod\xE8le pour plusieurs entrepreneurs qui fa\xE7onnent l\u2019\xE9conomie
    verte du Qu\xE9bec.\"\n## \xC0 propos de Biothermica\nFond\xE9e en 1987, Biothermica
    est un chef de file dans le d\xE9veloppement, le financement, la construction
    et l\u2019op\xE9ration de projets d\u2019\xE9limination et de valorisation du
    m\xE9thane \xE9mis par les sites d\u2019enfouissement et les mines de charbon
    souterraines. En tant que d\xE9veloppeur int\xE9gr\xE9, l\u2019entreprise commercialise
    \xE9galement les cr\xE9dits de carbone et l\u2019\xE9lectricit\xE9 g\xE9n\xE9r\xE9s
    par ses projets sur les march\xE9s domestiques et internationaux. Biothermica
    a r\xE9alis\xE9 des projets de g\xE9n\xE9ration de cr\xE9dits de carbone et d\u2019\xE9lectricit\xE9
    en Am\xE9rique du Nord et en Am\xE9rique centrale. [www.biothermica.com](http://www.biothermica.com)\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 peut contenir certaines donn\xE9es
    non historiques constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel,
    et notamment des d\xE9clarations prospectives concernant des \xE9v\xE8nements,
    tendances, plans ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur
    les vues et hypoth\xE8ses actuelles de la Direction de l\u2019entreprise et sont
    sujettes \xE0 des risques et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence
    entre les r\xE9sultats r\xE9els et ceux contenus explicitement ou implicitement
    dans ces d\xE9clarations."
  body_en: "Montreal \u2013 Savannah, November 13, 2012 \u2013 Biothermica, a leading
    clean technology company, is proud to announce it has won the Clean Technology
    Later Stage award delivered by the Global Cleantech Cluster Association (GCCA).
    The award was received yesterday at the Savannah International Clean Energy Conference,
    in Georgia.\nThe GCCA rewards leading companies in the high-growth field of clean
    technology and renewable energy. This year, ten companies were finally selected
    among a record 200 nominations.\nBiothermica was rewarded for its active engagement,
    since 1987, in the destruction and utilization of methane emitted by landfills
    and underground coal mines. The company is notably responsible for the development,
    financing and implementation of the largest landfill gas power plant in Canada.
    Since 1996, the Gazmont power plant has generated more than 2 billion kWh of green
    electricity and reduced greenhouse gas (GHG) emissions by more than 11 million
    tons of CO2 equivalent (tCO2e), namely 700,000 tCO2e per year, the same as removing
    150,000 cars from the road.\nBiothermica also developed, financed and implemented
    the first coal mine ventilation air methane (VAM) destruction project at an active
    underground mine in North America. Based on the company\u2019s proprietary VAMOX\xAE
    technology, this project has been operational since March 2009 at a Walter Energy
    mine in Alabama, USA, and is registered with the rigorous Climate Action Reserve
    (CAR) carbon standard. Over its first 3.5 years of operation, the project has
    reduced GHG emissions by more than 80,000 tons of CO2 equivalent (tCO2e).\n\"We
    are honored to have been selected by the GCCA, and would also like to thank \xC9cotech
    Quebec, the Quebec clean technology cluster, for supporting our nomination,\"
    said Guy Drouin, President of Biothermica. \"This award recognizes our long-time
    involvement in methane destruction and utilization, as well as the importance
    of tackling these emissions on a global basis.\"\nLooking forward, Biothermica
    will continue to invest in projects dedicated to extracting value from landfill
    gas and coal mine methane. Based on the success of its VAMOX\xAE technology in
    Alabama, Biothermica has partnered with Walter Energy to develop VAM oxidation
    projects at all of the company\u2019s current and future suitable ventilation
    shafts. The first project under the agreement is planned to be operational in
    late 2013, reducing GHG emissions by some 400,000 tCO2e per year. Ultimately,
    the implementation of the entire pipeline of projects is expected to reduce emissions
    by approximately 3 million tCO2e per year.\n\"Biothermica\u2019s innovative technologies
    and projects are a clear illustration of the contribution of the clean technology
    industry to Quebec\u2019s sustainable development and the future cap-and-trade
    carbon market, which will be linked with California through the Western Climate
    Initiative,\" said Denis Leclerc, President and CEO of \xC9cotech Qu\xE9bec. \"We
    are proud of this leading Quebec company, as it represents a model for several
    entrepreneurs which are building Quebec\u2019s green economy.\"\nMethane is the
    second most important GHG and is 25 times more potent than CO2 over a 100 year
    period. Coal mine methane and landfill gas emissions combined account for 17%
    of global methane emissions, namely 1,170 million tCO2e per year.\n## About Biothermica\nFounded
    in 1987, Biothermica is a leader in the development, financing, building and operation
    of projects which capture and destroy methane emitted by landfill sites and underground
    coal mines. As a fully integrated project developer, the company also monetizes
    the energy and carbon offset credits generated by its projects on the national
    and international markets. Biothermica has completed carbon and energy projects
    in North and Central America. For more information about Biothermica, visit [www.biothermica.com](http://www.biothermica.com)\n##
    Disclaimer\nWhen reviewing this information consider that it was reported as of
    the date listed, reflected management views as of that date, should be considered
    in the context of the circumstances prevailing at that time and is only correct
    as of that date. The information can contain forward looking statements that are
    subject to known and unknown risks and uncertainties that could cause actual results
    to differ materially from those expressed or implied by such statements."
