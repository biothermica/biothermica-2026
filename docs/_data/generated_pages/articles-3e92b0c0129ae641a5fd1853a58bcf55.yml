_original:
  title: "Suivi et op\xE9ration r\xE9seaux de captage de biogaz"
  title_en: Monitoring and operation landfill gas extraction system
  mydate: "2016-07-31"
  body: "Biothermica Technologies renouvelle son mandat de suivi et op\xE9ration des
    r\xE9seaux de captage de biogaz de la Ville de Qu\xE9bec pour une p\xE9riode minimale
    de 3 ans.\_ Ces activit\xE9s incluent le LES Saint-Tite-des-Caps et le LES Beauport.\_
    Biothermica est heureuse de poursuivre ces activit\xE9s d'op\xE9ration des r\xE9seau
    de captage et des stations de pompage et de destruction.\_ En plus de la torch\xE8re
    au biogaz de Saint-Tite-des-Caps, Biothermica op\xE9rera maintenant le syst\xE8me
    de traitement par oxydation biologique du gaz d'enfouissement au LES Beauport
    au moyen du projet de biofiltration d\xE9velopp\xE9 pour la Ville de Qu\xE9bec
    par le CRIQ."
  body_en: "Biothermica Technologies renews its monitoring and operation mandate for
    the landfill gas extraction systems with the City of Qu\xE9bec for a period of
    at least 3 years.\_ This activity includes the Saint-Tite-des-Caps and the Beauport
    landfills.\_ Biothermica is pleased to continue the operation of the collection
    system and pumping and flaring stations.\_ In addition to the LFG flare at Saint-Tite-des-Caps,
    Biothermica now operate the LFG biological oxidation system at the Beauport landfill
    using a biofiltre developed by the CRIQ for the City of Qu\xE9bec."
