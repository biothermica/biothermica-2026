  title: "Guy Drouin honor\xE9 par Canada's Clean50"
  title_en: Guy Drouin honoured by Canada's Clean50
  mydate: "2016-09-22"
  body: "## Guy Drouin, pr\xE9sident de Biothermica, honor\xE9 par Canada's Clean50\nReconnu
    parmi les leaders de l'\xE9conomie verte au Canada\nMontr\xE9al, 20 septembre
    2016 \u2014 Le pr\xE9sident de Biothermica Carbone Inc., Guy Drouin, fait partie
    cette ann\xE9e des r\xE9cipiendaires du prix Canada's Clean50 (www.clean50.com),
    qui honore des leaders du milieu de la recherche, des entreprises, des organisations
    non gouvernementales et des gouvernements s'\xE9tant distingu\xE9s au cours des
    deux derni\xE8res ann\xE9es par leur contribution au d\xE9veloppement durable.
    Notons que ce prix a \xE9t\xE9 d\xE9cern\xE9 l'an dernier \xE0 des personnalit\xE9s
    canadiennes reconnues telles que Catherine Potvin, Chris Ragan et Stewart Elgie.\nC'est
    le d\xE9veloppement et la commercialisation \xE0 travers le monde de la technologie
    VAMOX, qui d\xE9truit les \xE9missions de m\xE9thane g\xE9n\xE9r\xE9es par l'exploitation
    des mines de charbon, qui a valu ce prix au pr\xE9sident et fondateur de Biothermica.\nCes
    \xE9missions sont responsables \xE0 elles seules d'environ 1 % des \xE9missions
    mondiales de gaz \xE0 effet de serre. Sous le leadership de Guy Drouin, Biothermica
    a financ\xE9, b\xE2ti, poss\xE9d\xE9 et op\xE9r\xE9 le premier syst\xE8me de r\xE9cup\xE9ration
    de m\xE9thane minier en Am\xE9rique du Nord, ce qui lui a permis de g\xE9n\xE9rer
    plus de 80 000 cr\xE9dits compensatoires vendus sur le march\xE9 du carbone de
    la Californie. Biothermica est ainsi devenue la premi\xE8re entreprise canadienne
    \xE0 offrir ce type de cr\xE9dits sur ce march\xE9.\n## \xC0 propos de Biothermica\nFond\xE9e
    en 1987, Biothermica est un chef de file dans le d\xE9veloppement, le financement,
    la construction et l'op\xE9ration de projets d'\xE9limination et de valorisation
    du m\xE9thane \xE9mis par les sites d'enfouissement et les mines de charbon souterraines.
    En tant que d\xE9veloppeur int\xE9gr\xE9, l'entreprise commercialise \xE9galement
    les cr\xE9dits de carbone et l'\xE9lectricit\xE9 g\xE9n\xE9r\xE9s par ses projets
    sur les march\xE9s domestiques et internationaux. Biothermica a r\xE9alis\xE9
    des projets en Am\xE9rique du Nord et en Am\xE9rique centrale."
  body_en: "## Guy Drouin, President and CEO of Biothermica, Honoured by Canada's
    Clean50\nRecognized as a leader of Canada's green economy\nMontr\xE9al, September
    20, 2016 \u2014 Guy Drouin, President of Biothermica Carbone Inc., is among the
    recipients of the Canada's Clean50 award (www.clean50.com), which honours leaders
    from the research community, companies, non-governmental organizations and governments
    who have distinguished themselves over the last two years through their contribution
    to sustainable development. Previous honorees include Catherine Potvin, Chris
    Ragan, and Stewart Elgie.\nThe award recognizes the development and global commercialization
    of the VAMOX technology, which destroys methane emissions from coal mining operations.\nThese
    emissions account for about 1% of global greenhouse gas emissions. Under Guy Drouin\u2019s
    leadership, Biothermica financed, built, owned, and operated the first coal mine
    methane recovery system in North America. This enabled the company to generate
    more than 80,000 offset credits sold on California\u2019s carbon market, making
    it the first Canadian company to offer this type of credit there.\n## About Biothermica\nFounded
    in 1987, Biothermica is a leader in the development, financing, construction,
    and operation of projects focused on the destruction and valorization of methane
    emitted by landfills and underground coal mines. As an integrated developer, the
    company also markets carbon credits and electricity generated by its projects
    in domestic and international markets. Biothermica has completed projects in North
    and Central America."
