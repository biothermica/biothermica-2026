  title: "Autorisation cl\xE9 obtenue pour un projet novateur d'att\xE9nuation des
    \xE9missions de m\xE9thane d'une mine de charbon"
  title_en: Key approval granted for First-of-Kind Coal Mine Methane Mitigation Project
    in North America
  mydate: "2008-04-28"
  body: "Montr\xE9al, Canada, le 28 avril 2008 \u2013 Biothermica annonce avoir re\xE7u
    l\u2019autorisation de la Mine Safety and Health Administration (MSHA) du Department
    of Labor des \xC9tats-Unis pour r\xE9aliser un projet novateur de r\xE9duction
    des \xE9missions de gaz \xE0 effet de serre (GES) \xE0 la mine de charbon no.
    7 de Jim Walter Resources situ\xE9e \xE0 Brookwood, Alabama.\nBiothermica utilisera
    son syst\xE8me VAMOXTM d\u2019oxydation thermique r\xE9g\xE9n\xE9rative pour d\xE9truire
    du m\xE9thane contenu dans l\u2019air issu du syst\xE8me de ventilation de la
    mine (ventilation air methane ou VAM) avant que ce dernier ne soit rejet\xE9 dans
    l\u2019atmosph\xE8re. Ce projet de d\xE9monstration g\xE9n\xE9rera des r\xE9ductions
    de GES de l\u2019ordre de 40 000 tonnes de CO2 \xE9quivalent (tCO2e) annuellement.\n\xABUne
    fois de plus, Biothermica fait figure de pionnier dans le domaine de la r\xE9duction
    des GES, nous serons en effet la premi\xE8re compagnie \xE0 oxyder du VAM d\u2019une
    mine de charbon active en Am\xE9rique \xBB, a indiqu\xE9 Guy Drouin, Pr\xE9sident
    de Biothermica. \xAB Notre projet sera \xE9galement l\u2019un des premiers au
    monde \xE0 g\xE9n\xE9rer des revenus bas\xE9s sur la vente de cr\xE9dits de carbone
    issus de la destruction du VAM \xBB.\nLe VAM constitue 60% \xE0 70% des \xE9missions
    de GES des mines de charbon souterraines. En 2007, les \xE9missions de VAM repr\xE9sentaient
    5% des \xE9missions globales de GES d\u2019origine humaine, soit approximativement
    300 millions de tCO2e. Les \xC9tats-Unis en sont le 2e plus grand \xE9metteur,
    \xE0 hauteur de 18% de ce total.\n\xABTraditionnellement consid\xE9r\xE9 comme
    un simple rejet, l\u2019air de ventilation constitue \xE0 pr\xE9sent une ressource
    valorisable sous forme de cr\xE9dits de carbone pouvant \xEAtre vendus sur le
    march\xE9\xBB explique Thomas E. McNider, Directeur g\xE9n\xE9ral de l\u2019ing\xE9nierie
    des mines chez Jim Walter Resources. \xAB De plus, le syst\xE8me VAMOXTM de Biothermica
    ne n\xE9cessite aucune modification \xE0 nos \xE9quipements existants et demeure
    ind\xE9pendant de nos syst\xE8mes de ventilation \xBB.\nBiothermica pr\xE9voit
    d\xE9velopper des projets d\u2019oxydation du VAM fond\xE9s sur la mon\xE9tisation
    des cr\xE9dits de carbone \xE0 travers le monde dans le cadre de diff\xE9rentes
    initiatives de r\xE9duction des GES, tel le m\xE9canisme de d\xE9veloppement propre
    (MDP) du Protocole de Kyoto.\nBiothermica se distingue d\xE9j\xE0 comme un des
    d\xE9veloppeurs de projets MDP les plus performants dans le domaine des biogaz
    issus des sites d\u2019enfouissement de d\xE9chets. Son projet situ\xE9 \xE0 Nejapa,
    El Salvador, a notamment d\xE9pass\xE9 les objectifs de production de cr\xE9dits
    de carbone d\xE8s sa premi\xE8re ann\xE9e d\u2019op\xE9ration.\n## Au sujet de
    Biothermica\nFond\xE9e \xE0 Montr\xE9al en 1987, Biothermica est un chef de file
    dans la conception, la construction et la livraison cl\xE9s en main de solutions
    pour le contr\xF4le de la pollution atmosph\xE9rique et la gestion des biogaz
    ainsi que de projets de production d\u2019\xE9nergie renouvelable. De plus, Biothermica
    finance, structure et investit sous forme d\u2019\xE9quit\xE9 dans des projets
    techniquement pertinents. Biothermica a r\xE9alis\xE9 des projets en Am\xE9rique
    du nord, en Am\xE9rique Latine, en Asie (incluant la Chine), en Afrique et en
    Europe. [www.biothermica.com](https://www.biothermica.com)\n## Au sujet de Jim
    Walter Resources**\nJim Walter Resources Inc. (JWR) est le premier producteur
    mondial de charbon Blue Creek. Reconnu mondialement aupr\xE8s des producteurs
    de charbon, le gisement Blue Creek est situ\xE9 au coeur du bassin Warrior (\xC9tats-Unis),
    riche en charbon. JWR fournit un charbon \xE0 teneur \xE9lev\xE9e en BTU et faible
    en soufre provenant de mines parmi les plus profondes du continent am\xE9ricain.
    Des clients pr\xE9sents sur cinq continents utilisent le charbon Blue Creek pour
    satisfaire leurs sp\xE9cifications m\xE9tallurgiques et thermiques exigeantes.\n##
    Avertissement\nLe pr\xE9sent communiqu\xE9 de presse contient certaines donn\xE9es
    non historiques constituant des d\xE9clarations \xE0 caract\xE8re pr\xE9visionnel,
    et notamment les d\xE9clarations prospectives concernant des \xE9v\xE8nements,
    tendances, plans ou objectifs futurs. Ces d\xE9clarations sont fond\xE9es sur
    les vues et hypoth\xE8ses actuelles de la Direction de l\u2019entreprise et sont
    sujettes \xE0 des risques et al\xE9as susceptibles d\u2019entra\xEEner une diff\xE9rence
    entre les r\xE9sultats r\xE9els et ceux contenus explicitement ou implicitement
    dans ces d\xE9clarations."
  body_en: "Montreal, Canada, April 28, 2008 \u2013 Biothermica announces today it
    has received authorization from the U.S. Department of Labor\u2019s Mine Safety
    and Health Administration (MSHA) to proceed with the implementation of an innovative
    greenhouse gas (GHG) emission reduction project at Jim Walter Resources\u2019
    coal mine no. 7 in Brookwood, Alabama.\nBiothermica will use its VAMOXTM regenerative
    thermal oxidation system to destroy ventilation air methane (VAM - methane gas
    contained in mine exhaust air) before this potent GHG is released to the atmosphere.
    This demonstration project will achieve GHG emission reductions of some 40,000
    tons of CO2 equivalent (tCO2e) annually.\n\u201COnce more, Biothermica positions
    itself as a pioneer of GHG mitigation initiatives, as we will be the first company
    to oxidize VAM at an active coal mine in America,\u201D said Guy Drouin, President
    of Biothermica. \u201COur project will also be one of the first in the world to
    generate an income stream based on the selling of carbon credits resulting from
    VAM destruction.\u201D\nVAM constitutes 60% to 70% of the GHG emissions from underground
    coal mines. In 2007, VAM emissions made up 5% of all man-induced GHG emissions
    (about 300 million tCO2e). The U.S.A. is the second largest contributor with about
    18% of this total.\n\u201CHistorically considered as waste, ventilation air can
    now turn into a valuable asset that can be sold as carbon credits on the market,\u201D
    said Thomas E. McNider, General Manager of Mining Engineering at Jim Walter Resources.
    \u201CMoreover, Biothermica\u2019s VAMOXTM requires no modification to our existing
    mine equipment and remains independent from our ventilation systems.\u201D\nBiothermica
    plans to develop VAM oxidation projects based on the monetization of carbon credits
    across the world under different GHG emission reduction schemes such as the Clean
    Development Mechanism (CDM) of the Kyoto Protocol.\nBiothermica has already established
    itself as one of the best performing CDM project developers in the landfill gas
    sector with its project in Nejapa, El Salvador. This project exceeded carbon credits
    production targets within its first year of operation.\n## About Biothermica\nFounded
    in Montreal (Canada) in 1987, Biothermica is a leader in the design, construction
    and turn-key delivery of air pollution control and landfill gas solutions as well
    as waste-to-energy and emission reduction projects. Biothermica also finances,
    structures and takes equity in technically relevant projects. Biothermica has
    completed projects in North and South America, Asia (including China), Africa
    and Europe. [www.biothermica.com](https://www.biothermica.com)\n## About Jim Walter
    Resources\nJim Walter Resources Inc. (JWR) is the world's largest producer of
    Blue Creek Coal. Known worldwide among coal producers, the Blue Creek Seam is
    located in the heart of Alabama's coal-rich Warrior Basin (U.S.A.). JWR provides
    coal with high BTU and low sulfur content from some of the deepest mines on the
    North American continent. Customers on five continents have utilized Blue Creek
    Coal to meet their demanding metallurgical and thermal specifications.\n## Disclaimer\nWhen
    reviewing this information please note that it was created as of the date listed,
    reflects management views as of that date, and should be considered in the context
    of the circumstances prevailing at that time. The information contains forward-looking
    statements that are subject to known and unknown risks and uncertainties that
    could cause actual results to differ materially from those expressed or implied."
